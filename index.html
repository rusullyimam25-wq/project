<div id="app-root"></div>
<style>
  :root {
    --bg: #F8FAFC;
    --panel: #FFFFFF;
    --border: #E2E8F0;
    --border-hover: #CBD5E1;
    --ink: #0F172A;
    --ink-soft: #64748B;
    --ink-muted: #94A3B8;
    
    --accent: #0F766E;
    --accent-bg: #F0FDFA;
    --accent-hover: #0D9488;
    
    --tinggi: #E11D48;
    --tinggi-bg: #FFF1F2;
    --sedang: #D97706;
    --sedang-bg: #FFFBEB;
    --rendah: #059669;
    --rendah-bg: #ECFDF5;
    
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --radius: 8px;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }

  #app-root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 60px;
  }
  
  .wrap { max-width: 800px; margin: 0 auto; }

  /* Header Header */
  .masthead {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .masthead h1 { font-size: 22px; font-weight: 700; margin: 0; color: var(--ink); letter-spacing: -0.02em; }
  .masthead .unit { font-size: 13px; color: var(--ink-soft); font-weight: 500; }

  /* Stats Grid */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-card .num { font-size: 26px; font-weight: 800; color: var(--ink); line-height: 1; letter-spacing: -0.03em; }
  .stat-card .lbl { font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-top: 6px; }
  .stat-card.tinggi .num { color: var(--tinggi); }

  /* Toolbar */
  .toolbar {
    display: flex; gap: 12px; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filter-group { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 500; }

  /* Buttons & Selects */
  select {
    font-size: 13px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--ink); outline: none; transition: border-color 0.2s;
    max-width: 200px;
  }
  select:focus { border-color: var(--accent); }

  button { font-family: inherit; cursor: pointer; border: none; font-size: 13px; font-weight: 600; border-radius: 6px; transition: all 0.2s; }
  
  .btn-primary { background: var(--accent); color: #fff; padding: 8px 16px; }
  .btn-primary:hover { background: var(--accent-hover); }
  
  .btn-secondary { background: var(--panel); border: 1px solid var(--border); color: var(--ink); padding: 8px 14px; }
  .btn-secondary:hover { background: #F1F5F9; border-color: var(--border-hover); }
  
  .btn-text { background: none; color: var(--ink-soft); font-weight: 500; text-decoration: underline; padding: 4px; }
  .btn-text:hover { color: var(--tinggi); }

  /* Form Container */
  .form-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow-md); display: none;
  }
  .form-panel.open { display: block; }
  .form-panel h2 { font-size: 15px; font-weight: 700; margin: 0 0 16px; color: var(--ink); }
  .field-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    font-family: inherit; font-size: 13px; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 6px; background: #FFF; color: var(--ink); outline: none; transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 60px; }
  
  .coords-row { display: flex; gap: 8px; }
  .btn-geo { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--border); padding: 8px 12px; white-space: nowrap; }
  .btn-geo:hover { background: #CCFBF1; }

  /* Cards Ticket */
  .ticket {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .ticket:hover { box-shadow: var(--shadow-md); }
  .ticket::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
  }
  .ticket.tinggi::before { background: var(--tinggi); }
  .ticket.sedang::before { background: var(--sedang); }
  .ticket.rendah::before { background: var(--rendah); }
  .ticket.selesai { opacity: 0.6; }

  .ticket-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .ticket-id { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .ticket-cust { font-size: 16px; font-weight: 700; color: var(--ink); margin-top: 2px; }
  
  .ticket-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .badge-tinggi { background: var(--tinggi-bg); color: var(--tinggi); }
  .badge-sedang { background: var(--sedang-bg); color: var(--sedang); }
  .badge-rendah { background: var(--rendah-bg); color: var(--rendah); }

  .case-tag {
    background: #F1F5F9; color: #334155; font-size: 11px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px; margin-right: 6px; display: inline-block;
  }
  .ticket-meta { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .ticket-desc { font-size: 14px; color: var(--ink); line-height: 1.5; }

  /* Schedule Box Inside Card */
  .schedule-box {
    background: #F8FAFC; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .schedule-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .schedule-title { font-weight: 700; color: var(--accent); }
  .deadline-tag { font-weight: 700; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .deadline-normal { background: #E2E8F0; color: #334155; }
  .deadline-warning { background: var(--sedang-bg); color: var(--sedang); }
  .deadline-overdue { background: var(--tinggi-bg); color: var(--tinggi); }

  /* Mini Map Container */
  .ticket-map-container {
    width: 100%; height: 140px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-top: 4px; z-index: 1;
  }
  .ticket-loc { font-size: 12px; display: flex; gap: 12px; margin-top: 4px; }
  .ticket-loc a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .ticket-loc a:hover { text-decoration: underline; }

  .ticket-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .ticket-actions button {
    font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: #FFF; color: var(--ink-soft);
  }
  .ticket-actions button:hover { background: #F1F5F9; color: var(--ink); }
  .ticket-actions button.progress { border-color: var(--accent); color: var(--accent); }
  .ticket-actions button.done { border-color: var(--rendah); color: var(--rendah); }
  .ticket-actions button.del { margin-left: auto; border-color: transparent; color: var(--ink-muted); }
  .ticket-actions button.del:hover { color: var(--tinggi); background: var(--tinggi-bg); }

  /* Sections */
  .section-head {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); margin: 24px 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-head .count {
    background: #E2E8F0; color: var(--ink); font-size: 11px; font-weight: 700;
    border-radius: 12px; padding: 2px 8px;
  }
  .section-head.first { margin-top: 0; }

  .empty {
    text-align: center; padding: 32px 16px; color: var(--ink-soft); font-size: 13px;
    border: 1px dashed var(--border); border-radius: var(--radius); background: var(--panel);
  }

  /* MODAL POP-UP KALENDER */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); display: none;
    align-items: center; justify-content: center; z-index: 9999; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-content {
    background: var(--panel); border-radius: 12px; width: 100%; max-width: 760px;
    max-height: 85vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow-lg);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h2 { font-size: 18px; font-weight: 700; margin: 0; }
  .modal-close { background: none; border: none; font-size: 22px; color: var(--ink-soft); cursor: pointer; }
  
  .calendar-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 12px;
  }
  .cal-day-head {
    text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; padding: 4px 0;
  }
  .cal-cell {
    background: #FFF; border: 1px solid var(--border); border-radius: 8px; min-height: 85px; padding: 8px;
    display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: all 0.2s;
  }
  .cal-cell:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
  .cal-cell.today { border-color: var(--accent); background: var(--accent-bg); }
  .cal-cell.other-month { opacity: 0.3; }
  .cal-date-num { font-size: 13px; font-weight: 700; color: var(--ink); }
  .cal-count-badge {
    background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
    padding: 3px 6px; border-radius: 4px; text-align: center;
  }
  .cal-count-badge.tinggi { background: var(--tinggi); }
  
  .selected-day-details {
    margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px;
  }
  .selected-day-details h3 { font-size: 14px; font-weight: 700; margin: 0 0 12px; color: var(--ink); }
  .cal-item-mini {
    background: #F8FAFC; border-left: 4px solid var(--accent); padding: 8px 12px; margin-bottom: 8px; font-size: 13px; border-radius: 4px;
  }
  .cal-item-mini.tinggi { border-left-color: var(--tinggi); }
  .cal-item-mini.sedang { border-left-color: var(--sedang); }
</style>

    { key: "TERAREQ", label: "Tera Meter Request", weight: 2 },
    { key: "TR09", label: "Pindah Meter", weight: 3 },

  ];

  const SLA_DAYS = 14;
  const MAX_PER_DAY = 5;

  let complaints = [];
  let sortMode = "prioritas";
  let categoryFilter = "semua";
  let storageOk = true;
  let activeMaps = {};
  
  let calendarModalOpen = false;
  let selectedCalDateKey = null;

  function catInfo(key){
    return CATEGORIES.find(c => c.key === key) || { key: key||"OTHERS", label: key||"Lainnya", weight: 1 };
  }

  function urgencyLevel(item){
    const w = item.urgent ? 5 : catInfo(item.category).weight;
    if (w >= 5) return "tinggi";
    if (w >= 3) return "sedang";
    return "rendah";
  }

  function hoursWaiting(item){
    const ms = Date.now() - new Date(item.receivedAt).getTime();
    return Math.max(0, ms / 3600000);
  }

  function priorityScore(item){
    const w = item.urgent ? 5 : catInfo(item.category).weight;
    const hrs = Math.min(hoursWaiting(item), 336);
    return w * 100 + hrs;
  }

  function fmtWait(item){
    const hrs = hoursWaiting(item);
    if (hrs < 1) return Math.round(hrs*60) + " menit menunggu";
    const h = Math.floor(hrs);
    const m = Math.round((hrs - h) * 60);
    return h + "j " + (m>0? m+"m ":"") + "menunggu";
  }

  function fmtDateTime(dateObj){
    return dateObj.toLocaleString("id-ID", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function fmtDateOnly(dateObj){
    return dateObj.toLocaleString("id-ID", { day:"2-digit", month:"short", year:"numeric" });
  }

  function formatDateKey(d){
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function parseCoords(str){
    if(!str) return null;
    const parts = str.split(",").map(p => parseFloat(p.trim()));
    if(parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])){
      return { lat: parts[0], lng: parts[1] };
    }
    return null;
  }

  function getDeadlineInfo(item){
    const start = new Date(item.receivedAt);
    const deadline = new Date(start.getTime() + SLA_DAYS * 24 * 60 * 60 * 1000);
    const now = new Date();
    const diffMs = deadline - now;
    const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

    let statusClass = "deadline-normal";
    let statusText = `Sisa ${diffDays} hari`;

    if (diffMs < 0) {
      statusClass = "deadline-overdue";
      statusText = `Terlambat (${Math.abs(diffDays)} hari)`;
    } else if (diffDays <= 3) {
      statusClass = "deadline-warning";
      statusText = `Mendesak (${diffDays} hari lagi)`;
    }

    return {
      receivedText: fmtDateTime(start),
      deadlineText: fmtDateTime(deadline),
      statusClass,
      statusText
    };
  }

  function calculateCalendarSchedule(){
    const pendingItems = complaints
      .filter(c => c.status !== "selesai")
      .sort((a,b) => {
        const scoreA = priorityScore(a);
        const scoreB = priorityScore(b);
        if (scoreB !== scoreA) return scoreB - scoreA;
        return new Date(a.receivedAt) - new Date(b.receivedAt);
      });

    const dateMap = {};
    const itemScheduledDateMap = {};
    
    let currentDate = new Date();
    currentDate.setHours(0,0,0,0);

    let countInCurrentDay = 0;

    pendingItems.forEach(item => {
      const recDate = new Date(item.receivedAt);
      recDate.setHours(0,0,0,0);

      if (recDate > currentDate) {
        currentDate = new Date(recDate);
        countInCurrentDay = 0;
      }

      if (countInCurrentDay >= MAX_PER_DAY) {
        currentDate.setDate(currentDate.getDate() + 1);
        countInCurrentDay = 0;
      }

      const dateKey = formatDateKey(currentDate);
      if (!dateMap[dateKey]) dateMap[dateKey] = [];
      dateMap[dateKey].push(item);

      itemScheduledDateMap[item.id] = new Date(currentDate);
      countInCurrentDay++;
    });

    return { dateMap, itemScheduledDateMap };
  }

  async function removeComplaint(id){
    try{
      const { error } = await sb.from(TABLE).delete().eq("id", id);
      if(error) throw error;
    }catch(e){
      console.error(e);
      storageOk = false;
    }
    await load();
  }

  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c => {
      if(c === null || c === undefined) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  function nowLocalInputValue(){
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,16);
  }

  let formOpen = false;
  let editingId = null;

  function renderForm(){
    if(!formOpen) return el("div");

    const editing = editingId ? complaints.find(x => x.id === editingId) : null;
    const toLocalInput = (iso) => {
      const d = new Date(iso);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0,16);
    };

    const customerInput = el("input", { type:"text", placeholder:"Nama pelanggan / ID langganan", value: editing ? editing.customer : "" });
    const areaInput = el("input", { type:"text", placeholder:"Area / zona", value: editing ? editing.area : "" });
    const catSelect = el("select", {},
      ...CATEGORIES.map(c => el("option", { value: c.key, selected: editing && editing.category===c.key ? "selected" : null }, `[${c.key}] ${c.label}`))
    );

    const descInput = el("textarea", { placeholder:"Detail komplain dari pelanggan..." }, editing ? editing.desc : "");
    const timeInput = el("input", { type:"datetime-local", value: editing ? toLocalInput(editing.receivedAt) : nowLocalInputValue() });
    const urgentCheck = el("input", { type:"checkbox", checked: editing && editing.urgent ? "checked" : null });
    const coordsInput = el("input", { type:"text", placeholder:"-6.1783, 106.6319 (opsional)", value: editing ? (editing.coords||"") : "" });
    
    const geoBtn = el("button", { type:"button", class:"btn-geo", onclick: () => {
      if(!navigator.geolocation){ alert("Perangkat ini tidak mendukung GPS."); return; }
      geoBtn.disabled = true;
      geoBtn.textContent = "Mengambil...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          coordsInput.value = pos.coords.latitude.toFixed(6) + ", " + pos.coords.longitude.toFixed(6);
          geoBtn.disabled = false;
          geoBtn.textContent = "📍 Lokasi Saat Ini";
        },
        () => {
          alert("Tidak bisa mengambil lokasi. Pastikan izin GPS diaktifkan.");
          geoBtn.disabled = false;
          geoBtn.textContent = "📍 Lokasi Saat Ini";
        }
      );
    }}, "📍 Lokasi Saat Ini");

    return el("div", { class:"form-panel open" },
      el("h2", {}, editing ? "Ubah Komplain " + editing.id : "Tambah Komplain Baru"),
      el("div", { class:"field-row" },
        el("div", { class:"field" }, el("label", {}, "Pelanggan"), customerInput),
        el("div", { class:"field" }, el("label", {}, "Area / Zona"), areaInput),
      ),
      el("div", { class:"field-row" },
        el("div", { class:"field" }, el("label", {}, "Jenis CASE Keluhan"), catSelect),
        el("div", { class:"field" }, el("label", {}, "Waktu Diterima"), timeInput),
      ),
      el("div", { class:"field-row" },
        el("div", { class:"field" }, el("label", {}, "Deskripsi"), descInput),
        el("div", { class:"field" },
          el("label", {}, "Koordinat Lokasi"),
          el("div", { class:"coords-row" }, coordsInput, geoBtn)
        ),
      ),
      el("label", { style: "display:flex; align-items:center; gap:8px; font-size:13px; margin: 8px 0 16px; cursor:pointer;" }, 
        urgentCheck, "Tandai mendesak (Prioritas Utama)"
      ),
      el("div", { style: "display:flex; gap:8px;" },
        el("button", { class:"btn-primary", onclick: () => {
          if(!customerInput.value.trim()){ customerInput.focus(); return; }
          const data = {
            customer: customerInput.value.trim(),
            area: areaInput.value.trim(),
            category: catSelect.value,
            desc: descInput.value.trim(),
            receivedAt: new Date(timeInput.value).toISOString(),
            urgent: urgentCheck.checked,
            coords: coordsInput.value.trim(),
          };
          if(editing){ updateComplaint(editing.id, data); }
          else{ addComplaint(data); }
          formOpen = false;
          editingId = null;
        }}, editing ? "Simpan Perubahan" : "Simpan Komplain"),
        el("button", { class:"btn-secondary", onclick: () => { formOpen = false; editingId = null; render(); } }, "Batal")
      )
    );
  }

  function renderTicket(item, itemScheduledDateMap){
    const level = urgencyLevel(item);
    const badgeText = level === "tinggi" ? "Tinggi" : level === "sedang" ? "Sedang" : "Rendah";
    const isDone = item.status === "selesai";
    const coordsObj = parseCoords(item.coords);
    const deadlineInfo = getDeadlineInfo(item);
    const mapContainerId = "map-" + item.id;
    const caseDetails = catInfo(item.category);

    const scheduledDateObj = itemScheduledDateMap[item.id];
    const scheduledText = scheduledDateObj ? fmtDateOnly(scheduledDateObj) : "-";

    return el("div", { class: "ticket " + level + (isDone ? " selesai" : "") },
      el("div", { class:"ticket-top" },
        el("div", {},
          el("div", { class:"ticket-id" }, item.id),
          el("div", { class:"ticket-cust" }, item.customer)
        ),
        el("span", { class:"ticket-badge badge-" + level }, badgeText)
      ),
      el("div", { class:"ticket-meta" }, 
        el("span", { class:"case-tag" }, caseDetails.key),
        " ", caseDetails.label, item.area ? " · " + item.area : ""
      ),
      item.desc ? el("div", { class:"ticket-desc" }, item.desc) : null,
      
      // Schedule Box
      el("div", { class:"schedule-box" },
        el("div", { class:"schedule-row" },
          el("span", { class:"schedule-title" }, `📅 Jadwal Kerja: ${scheduledText}`),
          el("span", { class:`deadline-tag ${deadlineInfo.statusClass}` }, deadlineInfo.statusText)
        ),
        el("div", { style:"color:var(--ink-soft);" }, `Diterima: ${deadlineInfo.receivedText}`),
        el("div", { style:"color:var(--ink-soft);" }, `Batas SLA (14 Hari): ${deadlineInfo.deadlineText}`)
      ),

      // Mini Map Container
      coordsObj ? el("div", {},
        el("div", { id: mapContainerId, class: "ticket-map-container" }),
        el("div", { class:"ticket-loc" },
          el("a", { href: "https://www.google.com/maps?q=" + encodeURIComponent(item.coords), target:"_blank", rel:"noopener" }, "Lihat Google Maps ↗"),
          el("a", { href: "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(item.coords), target:"_blank", rel:"noopener" }, "🧭 Navigasi ↗")
        )
      ) : null,

      el("div", { style: "font-size: 12px; color: var(--ink-soft); font-weight: 500;" },
        isDone ? "Status: Selesai" : fmtWait(item) + (item.status==="proses" ? " · sedang dikerjakan" : "")
      ),
      el("div", { class:"ticket-actions" },
        !isDone && item.status !== "proses" ? el("button", { class:"progress", onclick: () => setStatus(item.id, "proses") }, "Mulai Proses") : null,
        !isDone ? el("button", { class:"done", onclick: () => setStatus(item.id, "selesai") }, "Selesai") : null,
        isDone ? el("button", { class:"progress", onclick: () => setStatus(item.id, "proses") }, "Buka Lagi") : null,
        el("button", { onclick: () => { editingId = item.id; formOpen = true; render(); window.scrollTo({top:0, behavior:"smooth"}); } }, "Edit"),
        el("button", { class:"del", onclick: () => removeComplaint(item.id) }, "Hapus")
      )
    );
  }

  // MODAL KALENDER POP-UP
  function renderCalendarModal(dateMap){
    if(!calendarModalOpen) return el("div");

    const today = new Date();
    const currYear = today.getFullYear();
    const currMonth = today.getMonth();

    const firstDay = new Date(currYear, currMonth, 1);
    const lastDay = new Date(currYear, currMonth + 1, 0);
    const startDayOfWeek = firstDay.getDay();

    const days = [];
    for(let i=0; i<startDayOfWeek; i++){
      days.push(null);
    }
    for(let d=1; d<=lastDay.getDate(); d++){
      days.push(new Date(currYear, currMonth, d));
    }

    const selectedItems = selectedCalDateKey && dateMap[selectedCalDateKey] ? dateMap[selectedCalDateKey] : [];

    return el("div", { class: "modal-overlay open", onclick: (e) => {
      if(e.target.classList.contains("modal-overlay")){
        calendarModalOpen = false;
        render();
      }
    }},
      el("div", { class: "modal-content" },
        el("div", { class: "modal-header" },
          el("h2", {}, `Kalender Pengerjaan (${today.toLocaleString('id-ID', { month: 'long', year: 'numeric' })})`),
          el("button", { class: "modal-close", onclick: () => { calendarModalOpen = false; render(); } }, "×")
        ),
        el("div", { style: "font-size: 13px; color: var(--ink-soft); margin-bottom: 12px;" },
          "Setiap hari maksimal mengalokasikan 5 komplain berdasar urutan prioritas dan waktu diterima."
        ),
        
        // Grid Kalender
        el("div", { class: "calendar-grid" },
          ...["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"].map(h => el("div", { class: "cal-day-head" }, h)),
          ...days.map(dObj => {
            if(!dObj) return el("div", { class: "cal-cell other-month" });

            const key = formatDateKey(dObj);
            const items = dateMap[key] || [];
            const isToday = formatDateKey(today) === key;
            const hasHighPriority = items.some(x => urgencyLevel(x) === "tinggi");

            return el("div", {
              class: `cal-cell ${isToday ? 'today' : ''}`,
              onclick: () => { selectedCalDateKey = key; render(); }
            },
              el("div", { class: "cal-date-num" }, String(dObj.getDate())),
              items.length > 0 ? el("div", { class: `cal-count-badge ${hasHighPriority ? 'tinggi' : ''}` }, `${items.length} Kasus`) : null
            );
          })
        ),

        // Detail Rincian Kasus
        selectedCalDateKey ? el("div", { class: "selected-day-details" },
          el("h3", {}, `Daftar Tugas (${selectedCalDateKey}): ${selectedItems.length} Kasus`),
          selectedItems.length === 0 
            ? el("div", { style: "font-size:13px; color:var(--ink-soft);" }, "Tidak ada komplain pada tanggal ini.")
            : el("div", {},
                ...selectedItems.map(item => {
                  const lvl = urgencyLevel(item);
                  return el("div", { class: `cal-item-mini ${lvl}` },
                    el("strong", {}, `${item.id} - ${item.customer}`),
                    el("div", {}, `[${item.category}] ${catInfo(item.category).label}`),
                    el("div", { style:"font-size:11px; color:var(--ink-soft); margin-top:2px;" }, `Area: ${item.area || '-'} | Diterima: ${fmtDateOnly(new Date(item.receivedAt))}`)
                  );
                })
              )
        ) : null
      )
    );
  }

  function initMaps(){
    Object.keys(activeMaps).forEach(id => {
      activeMaps[id].remove();
      delete activeMaps[id];
    });

    complaints.forEach(item => {
      const coords = parseCoords(item.coords);
      const container = document.getElementById("map-" + item.id);
      
      if(container && coords){
        const map = L.map(container, {
          attributionControl: false,
          zoomControl: false
        }).setView([coords.lat, coords.lng], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(map);

        L.marker([coords.lat, coords.lng]).addTo(map)
          .bindPopup(`<b>${item.customer}</b><br>[${item.category}]`);

        activeMaps[item.id] = map;
      }
    });
  }

  function render(){
    const root = document.getElementById("app-root");
    root.innerHTML = "";

    const { dateMap, itemScheduledDateMap } = calculateCalendarSchedule();

    const base = categoryFilter === "semua" ? complaints : complaints.filter(c => c.category === categoryFilter);

    const getScheduledOrder = (items) => {
      return [...items].sort((a,b) => {
        const scoreA = priorityScore(a);
        const scoreB = priorityScore(b);
        if (scoreB !== scoreA) return scoreB - scoreA;
        return new Date(a.receivedAt) - new Date(b.receivedAt);
      });
    };

    const sortedByMode = (items) => {
      if(sortMode === "prioritas") return getScheduledOrder(items);
      return [...items].sort((a,b) => new Date(a.receivedAt) - new Date(b.receivedAt));
    };

    const belum = sortedByMode(base.filter(c => c.status === "baru"));
    const proses = sortedByMode(base.filter(c => c.status === "proses"));
    const selesai = base.filter(c => c.status === "selesai").sort((a,b) => new Date(b.receivedAt) - new Date(a.receivedAt));

    const openAll = base.filter(c => c.status !== "selesai");
    const tinggiCount = openAll.filter(c => urgencyLevel(c) === "tinggi").length;
    const oldestHrs = openAll.length ? Math.max(...openAll.map(hoursWaiting)) : 0;

    const section = (title, items, isFirst) => el("div", {},
      el("div", { class:"section-head" + (isFirst ? " first" : "") }, title, el("span", { class:"count" }, String(items.length))),
      items.length === 0
        ? el("div", { class:"empty" }, "Tidak ada komplain di kategori ini.")
        : el("div", {}, ...items.map((item) => renderTicket(item, itemScheduledDateMap)))
    );

    const wrap = el("div", { class:"wrap" },
      el("div", { class:"masthead" },
        el("h1", {}, "Papan Kerja Komplain"),
        el("span", { class:"unit" }, "Aetra Air Tangerang")
      ),
      el("div", { class:"summary" },
        el("div", { class:"stat-card tinggi" }, el("div", { class:"num" }, String(tinggiCount)), el("div", { class:"lbl" }, "Prioritas Tinggi")),
        el("div", { class:"stat-card" }, el("div", { class:"num" }, String(openAll.length)), el("div", { class:"lbl" }, "Belum Selesai")),
        el("div", { class:"stat-card" }, el("div", { class:"num" }, oldestHrs >= 1 ? Math.round(oldestHrs)+"j" : "<1j"), el("div", { class:"lbl" }, "Menunggu Lama")),
      ),
      el("div", { class:"toolbar" },
        el("div", { class:"toolbar-actions" },
          el("button", { class:"btn-primary", onclick: () => { formOpen = !formOpen; if(!formOpen) editingId=null; render(); } }, formOpen ? "Tutup Form" : "+ Tambah Komplain"),
          el("button", { class:"btn-secondary", onclick: () => { calendarModalOpen = true; render(); } }, "📅 Kalender Pengerjaan")
        ),
        el("div", { class:"filters" },
          el("div", { class:"filter-group" },
            "CASE:",
            el("select", { onchange: (e) => { categoryFilter = e.target.value; render(); } },
              el("option", { value:"semua", selected: categoryFilter==="semua" ? "selected" : null }, "Semua CASE"),
              ...CATEGORIES.map(c => el("option", { value: c.key, selected: categoryFilter===c.key ? "selected" : null }, `[${c.key}] ${c.label}`))
            )
          ),
          el("div", { class:"filter-group" },
            "Urutkan:",
            el("select", { onchange: (e) => { sortMode = e.target.value; render(); } },
              el("option", { value:"prioritas", selected: sortMode==="prioritas" ? "selected" : null }, "Prioritas Utama"),
              el("option", { value:"waktu", selected: sortMode==="waktu" ? "selected" : null }, "Waktu Diterima")
            )
          )
        )
      ),
      renderForm(),
      section("Belum Dikerjakan", belum, true),
      section("Sedang Dikerjakan", proses, false),
      section("Selesai", selesai, false),
      el("div", { class:"foot-actions" },
        el("button", { class:"btn-text", onclick: async () => {
          if(confirm("Hapus semua data komplain dari server?")){
            for(const c of complaints){
              await sb.from(TABLE).delete().eq("id", c.id);
            }
            await load();
          }
        }}, "Kosongkan semua data")
      )
    );

    root.appendChild(wrap);
    root.appendChild(renderCalendarModal(dateMap));

    if(!storageOk){
      const warn = el("div", { style:"margin-top:12px; font-size:12px; color:var(--tinggi); text-align:center;" }, "Tidak bisa terhubung ke database. Periksa konfigurasi SUPABASE_URL / SUPABASE_ANON_KEY.");
      root.appendChild(warn);
    }

    setTimeout(initMaps, 50);
  }

  load();
  sb.channel("complaints-sync")
    .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, () => load())
    .subscribe();
  setInterval(render, 60000);
})();
</script>
