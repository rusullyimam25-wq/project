<div id="app-root"></div>

<style>
  :root {
    --bg: #F1F5F9;
    --panel: #FFFFFF;
    --border: #E2E8F0;
    --border-hover: #CBD5E1;
    --ink: #0F172A;
    --ink-soft: #64748B;
    --ink-muted: #94A3B8;
    
    --accent: #2563EB;
    --accent-bg: #EFF6FF;
    --accent-hover: #1D4ED8;
    
    --tinggi: #EF4444;
    --tinggi-bg: #FEF2F2;
    --sedang: #F59E0B;
    --sedang-bg: #FFFBEB;
    --rendah: #10B981;
    --rendah-bg: #ECFDF5;
    
    --wa: #25D366;
    --wa-hover: #1EBE5D;
    --resched: #7C3AED;
    --resched-bg: #F3E8FF;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius: 10px;
  }

  body.dark-mode {
    --bg: #0F172A;
    --panel: #1E293B;
    --border: #334155;
    --border-hover: #475569;
    --ink: #F8FAFC;
    --ink-soft: #94A3B8;
    --ink-muted: #64748B;
    --accent-bg: #1E3A8A;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: hidden; transition: background 0.3s, color 0.3s; }

  #app-root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex; flex-direction: column;
    padding: 16px 16px 20px;
  }
  
  .wrap { max-width: 1440px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; height: 100%; }

  .masthead {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding: 10px 16px; background: var(--panel);
    border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand-group { display: flex; align-items: center; gap: 14px; }
  .brand-logo { height: 32px; width: auto; object-fit: contain; }
  .brand-title h1 { font-size: 16px; font-weight: 800; margin: 0; color: var(--ink); letter-spacing: -0.02em; }
  .brand-title .unit { font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase; }

  .dashboard-grid-balanced {
    display: grid; grid-template-columns: 380px 1fr; gap: 16px;
    flex: 1; height: calc(100vh - 90px); overflow: hidden;
  }
  @media (max-width: 1024px) {
    .dashboard-grid-balanced { grid-template-columns: 1fr; height: auto; overflow: auto; }
  }

  .left-col-sidebar {
    display: flex; flex-direction: column; gap: 12px;
    height: 100%; overflow-y: auto; padding-right: 6px;
  }
  
  .right-col-content {
    display: flex; flex-direction: column; gap: 12px;
    height: 100%; overflow-y: auto; padding-right: 6px;
  }

  .left-col-sidebar::-webkit-scrollbar, .right-col-content::-webkit-scrollbar { width: 5px; }
  .left-col-sidebar::-webkit-scrollbar-thumb, .right-col-content::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

  .fleet-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px; box-shadow: var(--shadow-sm);
  }
  .fleet-header { font-size: 11.5px; font-weight: 700; margin-bottom: 6px; color: var(--ink); display: flex; justify-content: space-between; }
  #fleet-map-container { width: 100%; height: 160px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }

  .calendar-card {
    background: #0F172A; border-radius: var(--radius);
    padding: 14px; box-shadow: var(--shadow-md); color: #F8FAFC;
  }
  .cal-top-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 700; color: #38BDF8; padding-bottom: 6px; margin-bottom: 8px;
    border-bottom: 1px solid #334155;
  }
  .cal-month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-month-title { font-size: 12px; font-weight: 700; color: #F8FAFC; }
  .cal-nav-btns { display: flex; gap: 4px; }
  .cal-nav-btn {
    background: #1E293B; border: 1px solid #334155; font-size: 10px; cursor: pointer; color: #94A3B8; padding: 2px 5px; border-radius: 4px;
  }
  .cal-nav-btn:hover { color: #FFF; background: #334155; }

  .cal-grid-embedded { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-head-cell { font-size: 9.5px; font-weight: 700; color: #94A3B8; padding: 2px 0; text-transform: uppercase; }
  .cal-head-cell.weekend-head { color: #EF4444; }
  
  .cal-date-cell {
    padding: 3px 0; font-size: 11.5px; font-weight: 600; color: #E2E8F0;
    border-radius: 50%; width: 26px; height: 26px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: all 0.2s;
  }
  .cal-date-cell:hover { background: #334155; }
  .cal-date-cell.other-month { color: #475569; }
  .cal-date-cell.weekend-day { color: #F87171; background: rgba(239, 68, 68, 0.12); cursor: not-allowed; }
  .cal-date-cell.selected { background: #38BDF8 !important; color: #0F172A !important; font-weight: 800; }
  .cal-date-cell.has-tasks::after {
    content: ""; display: block; width: 4px; height: 4px; background: #38BDF8;
    border-radius: 50%; position: absolute; bottom: 1px;
  }

  .chart-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; box-shadow: var(--shadow-sm);
  }
  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chart-header h3 { font-size: 12.5px; font-weight: 700; margin: 0; color: var(--ink); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 10px; box-shadow: var(--shadow-sm); border-top: 3px solid var(--accent);
  }
  .stat-card .num { font-size: 18px; font-weight: 800; color: var(--ink); letter-spacing: -0.03em; }
  .stat-card .lbl { font-size: 10.5px; font-weight: 600; color: var(--ink-soft); margin-top: 1px; }

  .search-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .search-input {
    flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; background: var(--panel); color: var(--ink); outline: none;
  }
  .quick-badge {
    font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 14px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); color: var(--ink-soft);
  }
  .quick-badge.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }

  .toolbar { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .toolbar-actions { display: flex; gap: 5px; flex-wrap: wrap; }

  select, button { font-family: inherit; font-size: 11.5px; border-radius: 6px; border: 1px solid var(--border); }
  button { font-weight: 600; cursor: pointer; padding: 6px 10px; }
  .btn-primary { background: var(--accent); color: #fff; border: none; }
  .btn-secondary { background: var(--panel); color: var(--ink); }

  .form-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 8px; box-shadow: var(--shadow-md); display: none;
  }
  .form-panel.open { display: block; }
  .field-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 10.5px; font-weight: 600; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    font-family: inherit; font-size: 11.5px; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--panel); color: var(--ink);
  }

  .signature-pad { border: 1px dashed var(--border); border-radius: 6px; background: #FFF; cursor: crosshair; }

  .ticket {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 6px; position: relative;
  }
  .ticket-top { display: flex; justify-content: space-between; align-items: center; }
  .ticket-id { font-size: 11px; font-weight: 800; color: var(--accent); background: var(--accent-bg); padding: 2px 5px; border-radius: 4px; }
  .ticket-cust { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  
  .ticket-badge { font-size: 9.5px; font-weight: 800; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; }
  .badge-tinggi { background: var(--tinggi-bg); color: var(--tinggi); }
  .badge-sedang { background: var(--sedang-bg); color: var(--sedang); }
  .badge-rendah { background: var(--rendah-bg); color: var(--rendah); }

  .ticket-main-info { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 11px; color: var(--ink-soft); }
  .ticket-desc { font-size: 11.5px; color: var(--ink); background: var(--bg); padding: 5px 7px; border-radius: 5px; }

  .photo-proof-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
  .photo-box img { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }
  .photo-lbl { font-size: 9px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; }

  .ticket-actions { display: flex; gap: 5px; margin-top: 2px; flex-wrap: wrap; align-items: center; }
  .ticket-actions button { font-size: 10.5px; padding: 4px 8px; background: var(--panel); color: var(--ink); }
  
  .btn-wa {
    background: var(--wa) !important; color: #FFF !important; border: none !important;
    display: inline-flex; align-items: center; gap: 3px; font-weight: 700 !important;
    text-decoration: none; font-size: 10.5px; padding: 4px 8px; border-radius: 4px;
  }

  .countdown-timer { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: #FEF2F2; color: #EF4444; }
  
  .section-head { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--ink-soft); margin: 10px 0 6px; display: flex; align-items: center; gap: 5px; }
  .section-head .count { background: var(--border); color: var(--ink); font-size: 10px; border-radius: 10px; padding: 1px 5px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
(function(){
  const SUPABASE_URL = "https://bprmrbwmoadocyslhsqr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwcm1yYndtb2Fkb2N5c2xoc3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODc4ODgsImV4cCI6MjEwNDk2Mzg4OH0.oaCUIBFy2ii_ZBrR-XMpuL-UsGvTaH2CGmTpncvf5K8";
  const TABLE = "complaints";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const OFFICE_COORDS = { lat: -6.2231, lng: 106.5134 };
  const OFFICERS = ["Budi Santoso", "Agus Setiawan", "Dedi Kurniawan", "Hendra Wijaya", "Eko Prasetyo"];

  const CATEGORIES = [
    { key: "BPPD", label: "Biaya Penambahan Pipa Dinas", opRisk: 1, custImpact: 1 },
    { key: "KATM", label: "Air Tidak Mengalir Domestic", opRisk: 3, custImpact: 3 },
    { key: "KATR", label: "Air Kotor Domestic", opRisk: 2, custImpact: 3 },
    { key: "KBSM", label: "Bocor Sebelum Meter", opRisk: 3, custImpact: 3 },
    { key: "KKMR", label: "Kran Meter Rusak", opRisk: 2, custImpact: 2 },
    { key: "KPMR", label: "Meter Rusak", opRisk: 2, custImpact: 2 },
    { key: "TR09", label: "Pindah Meter", opRisk: 2, custImpact: 1 }
  ];

  let complaints = [];
  let searchQuery = "";
  let quickFilter = "semua";
  let isDarkMode = false;
  let fleetMapObj = null;
  let statusChartObj = null;

  let formOpen = false;
  let finishModalOpen = false;
  let finishTargetId = null;
  let editingId = null;

  function catInfo(key){ return CATEGORIES.find(c => c.key === key) || { key, label: key||"Lainnya" }; }

  function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
  function getNextWorkingDay(d) {
    let date = new Date(d);
    while (isWeekend(date)) { date.setDate(date.getDate() + 1); }
    return date;
  }

  function fmtDateTime(d){ return new Date(d).toLocaleString("id-ID", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" }); }

  /* ⏱️ COUNTDOWN TIMER SLA REAL-TIME */
  function getSLACountdown(receivedAt) {
    const deadline = new Date(new Date(receivedAt).getTime() + 14 * 24 * 60 * 60 * 1000);
    const diff = deadline - new Date();
    if (diff <= 0) return { text: "OVERDUE", isOverdue: true };
    
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    return { text: `⏳ Sisa ${days}d ${hours}h`, isOverdue: false };
  }

  /* 🔔 NOTIFIKASI WA WEBHOOK AUTOMATION */
  async function sendWAWebhookNotification(item, type) {
    const phone = item.phone ? item.phone.replace(/[^0-9]/g, '') : null;
    if (!phone) return;

    let msg = "";
    if (type === "CREATED") {
      msg = `Halo Bpk/Ibu ${item.customer}, komplain Anda [${item.id}] telah diterima dan dijadwalkan pada hari kerja terdekat. Terima kasih.`;
    } else if (type === "ON_THE_WAY") {
      msg = `Halo Bpk/Ibu ${item.customer}, petugas ${item.officer || 'Aetra'} sedang menuju ke lokasi Anda untuk pengerjaan WO ${item.id}.`;
    }

    try {
      console.log(`[WA Webhook Simulated Output to ${phone}]: ${msg}`);
    } catch(e) {}
  }

  async function load(){
    try {
      const { data } = await sb.from(TABLE).select("*").order("created_at", { ascending: true });
      if (data) complaints = data.map(row => ({
        id: row.id,
        customer: row.customer ? row.customer.replace(/\s*\(.*?\)/, '') : "",
        phone: row.phone || "",
        meterId: row.meter_id || "",
        address: row.address || "",
        area: row.area || "Cikupa",
        category: row.category,
        desc: row.description || "",
        receivedAt: row.received_at,
        urgent: row.urgent,
        coords: row.coords,
        status: row.status,
        officer: row.officer || ""
      }));
    } catch(e){}
    render();
  }

  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c => {
      if(c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  /* 🗺️ MINI INTERACTIVE FLEET MAP */
  function initFleetMap() {
    const container = document.getElementById("fleet-map-container");
    if (!container) return;

    if (fleetMapObj) { fleetMapObj.remove(); fleetMapObj = null; }
    
    fleetMapObj = L.map(container, { zoomControl: false }).setView([OFFICE_COORDS.lat, OFFICE_COORDS.lng], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(fleetMapObj);

    L.marker([OFFICE_COORDS.lat, OFFICE_COORDS.lng]).addTo(fleetMapObj).bindPopup("<b>Kantor Cikupa</b>");

    complaints.forEach(c => {
      if (c.status !== "selesai" && c.coords) {
        const parts = c.coords.split(",").map(p => parseFloat(p.trim()));
        if (parts.length === 2 && !isNaN(parts[0])) {
          L.circleMarker([parts[0], parts[1]], {
            radius: 6,
            fillColor: c.urgent ? '#EF4444' : '#2563EB',
            color: '#FFF', weight: 1, fillOpacity: 0.8
          }).addTo(fleetMapObj).bindPopup(`<b>${c.id}</b><br>${c.customer}`);
        }
      }
    });
  }

  /* 📊 DIAGRAM LINGKARAN / DONUT CHART STATUS */
  function renderDonutChart() {
    const canvas = document.getElementById("donutChartCanvas");
    if (!canvas) return;

    const belum = complaints.filter(c => c.status === "baru").length;
    const proses = complaints.filter(c => c.status === "proses").length;
    const selesai = complaints.filter(c => c.status === "selesai").length;

    if (statusChartObj) statusChartObj.destroy();

    statusChartObj = new Chart(canvas, {
      type: 'doughnut',
      data: {
        labels: ['Belum', 'Diproses', 'Selesai'],
        datasets: [{
          data: [belum, proses, selesai],
          backgroundColor: ['#3B82F6', '#F59E0B', '#10B981']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });
  }

  /* ✍️ DIGITAL SIGNATURE & PHOTO PROOF MODAL */
  function renderFinishModal() {
    if (!finishModalOpen) return el("div");

    const photoBeforeInput = el("input", { type: "text", placeholder: "URL Foto Sebelum Pengerjaan" });
    const photoAfterInput = el("input", { type: "text", placeholder: "URL Foto Sesudah Pengerjaan" });
    const canvas = el("canvas", { class: "signature-pad", width: 320, height: 100 });
    const ctx = canvas.getContext("2d");

    let drawing = false;
    canvas.addEventListener("mousedown", () => drawing = true);
    canvas.addEventListener("mouseup", () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener("mousemove", (e) => {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineWidth = 2; ctx.strokeStyle = "#0F172A";
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    });

    return el("div", { class: "form-panel open", style: "background:var(--panel); border:1px solid var(--accent);" },
      el("h2", { style: "margin-top:0;" }, `📸 Bukti Pengerjaan & Tanda Tangan (${finishTargetId})`),
      el("div", { class: "field-row" },
        el("div", { class: "field" }, el("label", {}, "Foto Before:"), photoBeforeInput),
        el("div", { class: "field" }, el("label", {}, "Foto After:"), photoAfterInput),
      ),
      el("div", { class: "field", style: "margin-bottom:10px;" },
        el("label", {}, "Tanda Tangan Pelanggan Digital:"),
        canvas,
        el("button", { class: "btn-secondary", style: "width:100px; margin-top:4px; font-size:10px;", onclick: () => ctx.clearRect(0,0,canvas.width,canvas.height) }, "Hapus TTD")
      ),
      el("div", { style: "display:flex; gap:8px;" },
        el("button", { class: "btn-primary", onclick: async () => {
          const target = complaints.find(c => c.id === finishTargetId);
          if (target) {
            target.status = "selesai";
            target.desc += ` [Before: ${photoBeforeInput.value || '-'}] [After: ${photoAfterInput.value || '-'}] [TTD Verified]`;
            await sb.from(TABLE).update({ status: "selesai", description: target.desc }).eq("id", target.id);
          }
          finishModalOpen = false;
          Swal.fire('Selesai!', 'Work Order telah diselesaikan.', 'success');
          await load();
        }}, "Verifikasi & Selesai"),
        el("button", { class: "btn-secondary", onclick: () => { finishModalOpen = false; render(); } }, "Batal")
      )
    );
  }

  function renderTicket(item) {
    const isDone = item.status === "selesai";
    const sla = getSLACountdown(item.receivedAt);

    return el("div", { class: "ticket" },
      el("div", { class: "ticket-top" },
        el("div", { style: "display:flex; gap:6px; align-items:center;" },
          el("span", { class: "ticket-id" }, item.id),
          el("span", { class: "ticket-cust" }, item.customer)
        ),
        el("div", { style: "display:flex; gap:4px; align-items:center;" },
          !isDone ? el("span", { class: "countdown-timer" }, sla.text) : null,
          el("span", { class: "ticket-badge badge-" + (item.urgent ? "tinggi" : "rendah") }, isDone ? "Selesai" : (item.urgent ? "Urgent" : "Normal"))
        )
      ),
      el("div", { class: "ticket-main-info" },
        el("span", {}, `[${item.category}] ${catInfo(item.category).label}`),
        item.officer ? el("span", { style: "color:var(--accent); font-weight:700;" }, `👷 ${item.officer}`) : null
      ),
      el("div", { class: "ticket-desc" }, item.desc),
      el("div", { class: "ticket-actions" },
        !isDone ? el("button", { class: "btn-primary", onclick: () => { finishTargetId = item.id; finishModalOpen = true; render(); } }, "✔️ Selesaikan") : null,
        !isDone ? el("button", { onclick: async () => {
          item.status = "proses";
          await sb.from(TABLE).update({ status: "proses" }).eq("id", item.id);
          await sendWAWebhookNotification(item, "ON_THE_WAY");
          render();
        }}, "🚀 On The Way") : null
      )
    );
  }

  function render(){
    const root = document.getElementById("app-root");
    if(!root) return;
    root.innerHTML = "";

    const activeList = complaints.filter(c => c.status !== "selesai");
    const doneList = complaints.filter(c => c.status === "selesai");

    const wrap = el("div", { class: "wrap" },
      el("div", { class: "masthead" },
        el("div", { class: "brand-group" },
          el("img", { class: "brand-logo", src: "https://aetraairtangerang.co.id/wp-content/uploads/2021/03/logo-aetra.png", alt: "Aetra" }),
          el("div", { class: "brand-title" },
            el("h1", {}, "Papan Kerja Minor Repair"),
            el("span", { class: "unit" }, "Aetra Air Tangerang")
          )
        ),
        el("button", { class: "btn-secondary", onclick: () => {
          isDarkMode = !isDarkMode;
          document.body.classList.toggle("dark-mode", isDarkMode);
        }}, isDarkMode ? "☀️ Light Mode" : "🌙 Dark Mode")
      ),

      el("div", { class: "dashboard-grid-balanced" },
        /* SIDEBAR KIRI */
        el("div", { class: "left-col-sidebar" },
          el("div", { class: "fleet-card" },
            el("div", { class: "fleet-header" }, el("span", {}, "🗺️ Fleet Map Sebaran Kasus")),
            el("div", { id: "fleet-map-container" })
          ),
          el("div", { class: "chart-card" },
            el("div", { class: "chart-header" }, el("h3", {}, "📊 Rasio Status Work Order")),
            el("div", { style: "height:140px; position:relative;" }, el("canvas", { id: "donutChartCanvas" }))
          )
        ),

        /* KOLOM KANAN */
        el("div", { class: "right-col-content" },
          renderFinishModal(),
          el("div", { class: "section-head" }, "Kasus Aktif", el("span", { class: "count" }, String(activeList.length))),
          ...activeList.map(renderTicket),
          el("div", { class: "section-head" }, "Selesai", el("span", { class: "count" }, String(doneList.length))),
          ...doneList.map(renderTicket)
        )
      )
    );

    root.appendChild(wrap);
    setTimeout(() => {
      initFleetMap();
      renderDonutChart();
    }, 100);
  }

  load();
})();
</script>
