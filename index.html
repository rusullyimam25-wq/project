<div id="app-root"></div>

<style>
  :root {
    --bg: #F8FAFC;
    --panel: #FFFFFF;
    --border: #E2E8F0;
    --border-hover: #CBD5E1;
    --ink: #0F172A;
    --ink-soft: #64748B;
    --ink-muted: #94A3B8;
    
    --accent: #2563EB;
    --accent-bg: #EFF6FF;
    --accent-hover: #1D4ED8;
    
    --tinggi: #EF4444;
    --tinggi-bg: #FEF2F2;
    --sedang: #F59E0B;
    --sedang-bg: #FFFBEB;
    --rendah: #10B981;
    --rendah-bg: #ECFDF5;
    
    --wa: #25D366;
    --wa-hover: #1EBE5D;

    --resched: #7C3AED;
    --resched-bg: #F3E8FF;
    
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }

  #app-root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  
  .wrap { max-width: 1200px; margin: 0 auto; }

  /* Header Brand */
  .masthead {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding: 14px 20px; background: var(--panel);
    border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  }
  .brand-group { display: flex; align-items: center; gap: 14px; }
  .brand-logo { height: 38px; width: auto; object-fit: contain; }
  .brand-title h1 { font-size: 17px; font-weight: 800; margin: 0; color: var(--ink); letter-spacing: -0.02em; }
  .brand-title .unit { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; }

  /* Grid System */
  .dashboard-grid {
    display: grid; grid-template-columns: 1fr 340px; gap: 20px;
  }
  @media (max-width: 900px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }

  /* Kalender Sidebar */
  .calendar-card {
    background: #0F172A; border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow-md); color: #F8FAFC; position: sticky; top: 20px;
  }
  .cal-top-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 700; color: #38BDF8; padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid #334155;
  }
  .cal-month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-month-title { font-size: 13px; font-weight: 700; color: #F8FAFC; }
  .cal-nav-btns { display: flex; gap: 4px; }
  .cal-nav-btn {
    background: #1E293B; border: 1px solid #334155; font-size: 11px; cursor: pointer; color: #94A3B8; padding: 3px 6px; border-radius: 4px;
  }
  .cal-nav-btn:hover { color: #FFF; background: #334155; }

  .cal-grid-embedded { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-head-cell { font-size: 10px; font-weight: 700; color: #94A3B8; padding: 4px 0; text-transform: uppercase; }
  .cal-date-cell {
    padding: 4px 0; font-size: 12px; font-weight: 600; color: #E2E8F0;
    border-radius: 50%; width: 28px; height: 28px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: all 0.2s;
  }
  .cal-date-cell:hover { background: #334155; }
  .cal-date-cell.other-month { color: #475569; }
  .cal-date-cell.selected { background: #38BDF8 !important; color: #0F172A !important; font-weight: 800; }
  .cal-date-cell.has-tasks::after {
    content: ""; display: block; width: 4px; height: 4px; background: #38BDF8;
    border-radius: 50%; position: absolute; bottom: 1px;
  }

  /* Summary Cards */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; box-shadow: var(--shadow-sm); border-top: 3px solid var(--accent);
  }
  .stat-card .num { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.03em; }
  .stat-card .lbl { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }
  .stat-card.tinggi { border-top-color: var(--tinggi); }
  .stat-card.tinggi .num { color: var(--tinggi); }
  .stat-card.selesai-stat { border-top-color: var(--rendah); }
  .stat-card.selesai-stat .num { color: var(--rendah); }

  /* Filters & Search */
  .search-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .search-input {
    flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 12.5px; background: var(--panel); outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .quick-badge {
    font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 16px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); color: var(--ink-soft); transition: all 0.2s;
  }
  .quick-badge:hover, .quick-badge.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }

  .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .filter-group { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }

  select {
    font-size: 12px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--ink); outline: none; font-weight: 500; cursor: pointer;
  }

  button { font-family: inherit; cursor: pointer; border: none; font-size: 12px; font-weight: 600; border-radius: 6px; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: #fff; padding: 8px 14px; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--panel); border: 1px solid var(--border); color: var(--ink); padding: 7px 12px; }
  .btn-autoassign { background: #0EA5E9; color: #FFF; padding: 8px 14px; }
  .btn-autoassign:hover { background: #0284C7; }
  .btn-excel { background: #10B981; color: #FFF; padding: 8px 14px; }

  /* Form Panels */
  .form-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 20px; box-shadow: var(--shadow-md); display: none;
  }
  .form-panel.open { display: block; }
  .form-panel h2 { font-size: 14px; font-weight: 700; margin: 0 0 12px; color: var(--ink); }
  .field-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    font-family: inherit; font-size: 12px; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; outline: none;
  }
  .field textarea { resize: vertical; min-height: 50px; }

  /* Modern Tickets */
  .ticket {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 8px; position: relative; transition: all 0.2s;
  }
  .ticket:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
  .ticket.selesai { opacity: 0.65; background: #F8FAFC; }

  .ticket-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ticket-id { font-size: 11.5px; font-weight: 800; color: var(--accent); background: var(--accent-bg); padding: 2px 6px; border-radius: 4px; }
  .ticket-cust { font-size: 13.5px; font-weight: 700; color: var(--ink); }
  
  .ticket-badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
  .badge-tinggi { background: var(--tinggi-bg); color: var(--tinggi); }
  .badge-sedang { background: var(--sedang-bg); color: var(--sedang); }
  .badge-rendah { background: var(--rendah-bg); color: var(--rendah); }

  .ticket-main-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-soft); }
  .case-tag { background: #F1F5F9; color: #334155; font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
  .officer-badge { background: #E0F2FE; color: #0369A1; font-weight: 700; font-size: 10.5px; padding: 2px 6px; border-radius: 4px; border: 1px solid #BAE6FD; }
  
  .ticket-address { font-size: 11.5px; color: #334155; line-height: 1.3; }
  .ticket-desc { font-size: 12px; color: var(--ink); background: #F8FAFC; padding: 6px 8px; border-radius: 6px; border-left: 2px solid var(--border-hover); }

  .schedule-row-simple { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); font-weight: 500; }
  
  .ticket-actions { display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; align-items: center; }
  .ticket-actions button { font-size: 11px; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: #FFF; color: var(--ink-soft); }
  .ticket-actions button.progress { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .ticket-actions button.done { border-color: var(--rendah); color: var(--rendah); background: var(--rendah-bg); }
  
  .btn-wa {
    background: var(--wa) !important; color: #FFF !important; border: none !important;
    display: inline-flex; align-items: center; gap: 4px; font-weight: 700 !important;
    text-decoration: none; font-size: 11px; padding: 5px 10px; border-radius: 4px;
  }

  .section-head {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); margin: 16px 0 10px; display: flex; align-items: center; gap: 6px;
  }
  .section-head .count { background: #E2E8F0; color: var(--ink); font-size: 10.5px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
  .empty { text-align: center; padding: 18px; color: var(--ink-soft); font-size: 12px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--panel); }
</style>

<!-- Supabase SDK & SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){
  const SUPABASE_URL = "https://bprmrbwmoadocyslhsqr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwcm1yYndtb2Fkb2N5c2xoc3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODc4ODgsImV4cCI6MjEwNDk2Mzg4OH0.oaCUIBFy2ii_ZBrR-XMpuL-UsGvTaH2CGmTpncvf5K8";
  const TABLE = "complaints";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Daftar Petugas Lapangan
  const OFFICERS = ["Budi Santoso", "Agus Setiawan", "Dedi Kurniawan", "Hendra Wijaya", "Eko Prasetyo"];

  const CATEGORIES = [
    { key: "KATM", label: "Air Tidak Mengalir Domestic" },
    { key: "KATR", label: "Air Kotor Domestic" },
    { key: "KBSM", label: "Bocor Sebelum Meter" },
    { key: "KKMR", label: "Kran Meter Rusak" },
    { key: "KPMR", label: "Meter Rusak" },
    { key: "TR09", label: "Pindah Meter" }
  ];

  let complaints = [];
  let searchQuery = "";
  let quickFilter = "semua";
  let officerFilter = "semua";
  let formOpen = false;
  let editingId = null;

  function catInfo(key){
    return CATEGORIES.find(c => c.key === key) || { key: key||"OTHERS", label: key||"Lainnya" };
  }

  function fmtDateTime(dateObj){
    return dateObj.toLocaleString("id-ID", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  // Algoritma Auto-Assign (Pembagian Merata)
  async function autoAssignMerata() {
    const unassigned = complaints.filter(c => !c.officer && c.status !== "selesai");
    if (unassigned.length === 0) {
      alert("Semua komplain yang aktif sudah memiliki petugas lapangan!");
      return;
    }

    // Hitung beban kerja awal tiap petugas
    const counts = {};
    OFFICERS.forEach(o => counts[o] = 0);
    complaints.forEach(c => {
      if (c.officer && OFFICERS.includes(c.officer) && c.status !== "selesai") {
        counts[c.officer]++;
      }
    });

    for (let item of unassigned) {
      // Cari petugas dengan jumlah tugas tersedikit
      let minOfficer = OFFICERS[0];
      let minCount = counts[OFFICERS[0]];

      for (let o of OFFICERS) {
        if (counts[o] < minCount) {
          minCount = counts[o];
          minOfficer = o;
        }
      }

      // Assign ke petugas tersebut
      item.officer = minOfficer;
      counts[minOfficer]++;

      // Update ke database
      let fullDesc = `${item.desc} [Petugas: ${minOfficer}]`;
      try {
        await sb.from(TABLE).update({ description: fullDesc }).eq("id", item.id);
      } catch(e) { console.error(e); }
    }

    alert(`Berhasil membagikan ${unassigned.length} Work Order secara merata ke petugas lapangan!`);
    await load();
  }

  function rowToItem(row){
    let extraOfficer = "";
    if (row.description && row.description.includes("[Petugas:")) {
      const mOff = row.description.match(/\[Petugas:\s*(.*?)\]/);
      if (mOff) extraOfficer = mOff[1];
    }

    return {
      id: row.id,
      customer: row.customer ? row.customer.replace(/\s*\(.*?\)/, '') : "",
      phone: row.phone || "",
      meterId: row.meter_id || "",
      address: row.address || "",
      area: row.area || "Cikupa",
      category: row.category,
      desc: row.description ? row.description.replace(/\[Petugas:.*?\]/g, '').trim() : "",
      receivedAt: row.received_at,
      urgent: row.urgent,
      coords: row.coords,
      status: row.status,
      officer: extraOfficer,
    };
  }

  async function addComplaint(data){
    const item = {
      id: "WO-" + Date.now().toString().slice(-6),
      customer: data.customer,
      phone: data.phone || "",
      meterId: data.meterId || "",
      address: data.address || "",
      area: data.area || "Cikupa",
      category: data.category || "KBSM",
      desc: data.desc || "",
      officer: data.officer || "",
      receivedAt: new Date().toISOString(),
      status: "baru",
    };

    let fullDesc = item.desc;
    if (item.officer) fullDesc += ` [Petugas: ${item.officer}]`;

    try {
      await sb.from(TABLE).insert({
        id: item.id,
        customer: item.customer,
        area: item.area,
        category: item.category,
        description: fullDesc,
        received_at: item.receivedAt,
        status: item.status
      });
    } catch(e) { console.error(e); }

    await load();
  }

  async function setStatus(id, status){
    try {
      await sb.from(TABLE).update({ status }).eq("id", id);
    } catch(e) { console.error(e); }
    await load();
  }

  async function load(){
    try {
      const { data } = await sb.from(TABLE).select("*").order("created_at", { ascending: true });
      if (data) complaints = data.map(rowToItem);
    } catch(e) { console.error(e); }
    render();
  }

  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c => {
      if(c === null || c === undefined) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  function renderForm(){
    if(!formOpen) return el("div");

    const customerInput = el("input", { type:"text", placeholder:"Nama Pelanggan" });
    const addressInput = el("input", { type:"text", placeholder:"Alamat Lengkap" });
    const areaInput = el("input", { type:"text", placeholder:"Area / Zona", value: "Cikupa" });
    const catSelect = el("select", {},
      ...CATEGORIES.map(c => el("option", { value: c.key }, `[${c.key}] ${c.label}`))
    );
    const officerSelect = el("select", {},
      el("option", { value: "" }, "-- Pilih Petugas (Atau Auto-Assign) --"),
      ...OFFICERS.map(o => el("option", { value: o }, o))
    );
    const descInput = el("textarea", { placeholder:"Detail komplain..." });

    return el("div", { class:"form-panel open" },
      el("h2", {}, "Tambah Work Order Baru"),
      el("div", { class:"field-row" },
        el("div", { class:"field" }, el("label", {}, "Nama Pelanggan *"), customerInput),
        el("div", { class:"field" }, el("label", {}, "Alamat Lengkap"), addressInput),
      ),
      el("div", { class:"field-row" },
        el("div", { class:"field" }, el("label", {}, "CASE Keluhan"), catSelect),
        el("div", { class:"field" }, el("label", {}, "Petugas Lapangan"), officerSelect),
      ),
      el("div", { class:"field-row" },
        el("div", { class:"field" }, el("label", {}, "Deskripsi"), descInput),
      ),
      el("div", { style: "display:flex; gap:8px;" },
        el("button", { class:"btn-primary", onclick: async () => {
          if (!customerInput.value.trim()) { alert("Nama wajib diisi!"); return; }
          await addComplaint({
            customer: customerInput.value.trim(),
            address: addressInput.value.trim(),
            area: areaInput.value.trim(),
            category: catSelect.value,
            officer: officerSelect.value,
            desc: descInput.value.trim()
          });
          formOpen = false; render();
        }}, "Simpan Komplain"),
        el("button", { class:"btn-secondary", onclick: () => { formOpen = false; render(); } }, "Batal")
      )
    );
  }

  function renderTicket(item){
    const isDone = item.status === "selesai";
    const caseDetails = catInfo(item.category);

    return el("div", { class: "ticket " + (isDone ? "selesai" : "") },
      el("div", { class:"ticket-top" },
        el("div", { style:"display:flex; align-items:center; gap:6px;" },
          el("span", { class:"ticket-id" }, item.id),
          el("span", { class:"ticket-cust" }, item.customer)
        ),
        item.officer 
          ? el("span", { class: "officer-badge" }, `👷 ${item.officer}`)
          : el("span", { style: "font-size:10.5px; color:var(--tinggi); font-weight:700;" }, "⚠️ Belum Ada Petugas")
      ),
      el("div", { class:"ticket-main-info" },
        el("span", { class:"case-tag" }, item.category),
        el("span", {}, caseDetails.label),
        el("span", { style:"font-weight:700; color:#92400E;" }, `• Area: ${item.area}`)
      ),
      item.address ? el("div", { class:"ticket-address" }, `📍 ${item.address}`) : null,
      item.desc ? el("div", { class:"ticket-desc" }, item.desc) : null,
      el("div", { class:"ticket-actions" },
        !isDone && item.status !== "proses" ? el("button", { class:"progress", onclick: () => setStatus(item.id, "proses") }, "Proses") : null,
        !isDone ? el("button", { class:"done", onclick: () => setStatus(item.id, "selesai") }, "Selesai") : null
      )
    );
  }

  function render(){
    const root = document.getElementById("app-root");
    if(!root) return;
    root.innerHTML = "";

    let base = complaints;

    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      base = base.filter(c => c.customer.toLowerCase().includes(q) || c.id.toLowerCase().includes(q));
    }

    if (officerFilter !== "semua") {
      base = base.filter(c => c.officer === officerFilter);
    }

    const belum = base.filter(c => c.status === "baru");
    const proses = base.filter(c => c.status === "proses");
    const selesai = base.filter(c => c.status === "selesai");

    const wrap = el("div", { class:"wrap" },
      el("div", { class:"masthead" },
        el("div", { class:"brand-group" },
          el("img", { class: "brand-logo", src: "https://aetraairtangerang.co.id/wp-content/uploads/2021/03/logo-aetra.png", alt: "Aetra Logo" }),
          el("div", { class:"brand-title" },
            el("h1", {}, "Papan Kerja & Distrbusi Petugas Lapangan"),
            el("span", { class:"unit" }, "Aetra Air Tangerang")
          )
        )
      ),

      el("div", { class:"toolbar" },
        el("div", { class:"toolbar-actions" },
          el("button", { class:"btn-primary", onclick: () => { formOpen = !formOpen; render(); } }, "+ Tambah Komplain"),
          el("button", { class:"btn-autoassign", onclick: () => autoAssignMerata() }, "⚖️ Auto-Assign Merata")
        ),
        el("div", { class:"filters" },
          el("div", { class:"filter-group" },
            "Filter Petugas:",
            el("select", { onchange: (e) => { officerFilter = e.target.value; render(); } },
              el("option", { value:"semua" }, "Semua Petugas"),
              ...OFFICERS.map(o => el("option", { value: o, selected: officerFilter===o ? "selected" : null }, o))
            )
          )
        )
      ),

      renderForm(),

      el("div", { class: "section-head" }, "Belum Dikerjakan ", el("span", { class:"count" }, String(belum.length))),
      ...belum.map(renderTicket),

      el("div", { class: "section-head" }, "Sedang Dikerjakan ", el("span", { class:"count" }, String(proses.length))),
      ...proses.map(renderTicket),

      el("div", { class: "section-head" }, "Selesai ", el("span", { class:"count" }, String(selesai.length))),
      ...selesai.map(renderTicket)
    );

    root.appendChild(wrap);
  }

  load();
})();
