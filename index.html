<div id="app-root"></div>

  @media (max-width: 1024px) {

  .left-col-sidebar {

    height: 100%; overflow-y: auto; padding-right: 6px;

  .right-col-content {

    height: 100%; overflow-y: auto; padding-right: 6px;

  .sla-alert-banner {

    padding: 8px 12px; border-radius: var(--radius); margin-bottom: 12px;
    font-size: 11.5px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;

    padding: 10px; box-shadow: var(--shadow-sm);

  .fleet-map-header { font-size: 11.5px; font-weight: 700; color: var(--ink); margin-bottom: 6px; display: flex; justify-content: space-between; }

  .calendar-card {

  .cal-top-header {

    font-size: 12px; font-weight: 700; color: #38BDF8; padding-bottom: 6px; margin-bottom: 8px;
    border-bottom: 1px solid #334155;

  .cal-month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-month-title { font-size: 12px; font-weight: 700; color: #F8FAFC; }
  .cal-nav-btns { display: flex; gap: 4px; }
  .cal-nav-btn {

  .cal-nav-btn:hover { color: #FFF; background: #334155; }

  .cal-head-cell.weekend-head { color: #EF4444; }
  
  .cal-date-cell {

    border-radius: 50%; width: 26px; height: 26px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: all 0.2s;
  }
  .cal-date-cell:hover { background: #334155; }
  .cal-date-cell.other-month { color: #475569; }
  .cal-date-cell.weekend-day { color: #F87171; background: rgba(239, 68, 68, 0.12); cursor: not-allowed; }
  .cal-date-cell.selected { background: #38BDF8 !important; color: #0F172A !important; font-weight: 800; }
  .cal-date-cell.has-tasks::after {
    content: ""; display: block; width: 4px; height: 4px; background: #38BDF8;
    border-radius: 50%; position: absolute; bottom: 1px;
  }
  .cal-date-cell.selected.has-tasks::after { background: #0F172A; }
  .cal-date-cell.has-high::after { background: var(--tinggi); }
  .cal-date-cell.all-done::after { background: var(--rendah); }

  .quota-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; margin-top: 10px; box-shadow: var(--shadow-sm);

  .quota-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }

  .chart-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; box-shadow: var(--shadow-sm);
  }
  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chart-header h3 { font-size: 12.5px; font-weight: 700; margin: 0; color: var(--ink); }
  .chart-header .total-badge { background: var(--accent-bg); color: var(--accent); font-weight: 700; font-size: 10px; padding: 2px 6px; border-radius: 12px; }
  
  .chart-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; padding-right: 4px; }
  .chart-item { font-size: 11px; }
  .chart-label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 2px; color: var(--ink-soft); }

  .chart-bar-fill { background: linear-gradient(90deg, #2563EB, #06B6D4); height: 100%; border-radius: 4px; transition: width 0.3s; }

  .officer-done-count { font-size: 10.5px; font-weight: 800; color: #047857; background: #D1FAE5; padding: 1px 4px; border-radius: 4px; }

  .btn-history { background: #0284C7; color: #FFF; padding: 7px 12px; }

  .btn-excel { background: #10B981; color: #FFF; padding: 7px 12px; }

  .btn-wa {
    background: var(--wa) !important; color: #FFF !important; border: none !important;
    display: inline-flex; align-items: center; gap: 3px; font-weight: 700 !important;
    text-decoration: none; font-size: 10.5px; padding: 4px 8px; border-radius: 4px;

  .empty { text-align: center; padding: 14px; color: var(--ink-soft); font-size: 11.5px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--panel); }

    return CATEGORIES.find(c => c.key === key) || { key: key||"OTHERS", label: key||"Lainnya", opRisk: 1, custImpact: 1, keywords:[] };
  }

  function formatWA(phoneStr) {
    if (!phoneStr) return "";
    let clean = phoneStr.replace(/[^0-9]/g, '');
    if (clean.startsWith('0')) clean = '62' + clean.slice(1);
    return clean;
  }

  function isWeekend(dateObj) {
    const day = dateObj.getDay();
    return day === 0 || day === 6;
  }

  function getNextWorkingDay(startDate) {
    let d = new Date(startDate);
    while (isWeekend(d)) {
      d.setDate(d.getDate() + 1);
    }
    return d;
  }

  function computeUrgencyMetrics(item) {
    const cInfo = catInfo(item.category);
    const scoreOpRisk = item.urgent ? 3 : (cInfo.opRisk || 1);
    const scoreCustImpact = item.urgent ? 3 : (cInfo.custImpact || 1);

    const start = new Date(item.receivedAt);
    const deadline = new Date(start.getTime() + SLA_DAYS * 24 * 60 * 60 * 1000);
    const diffDays = Math.ceil((deadline - new Date()) / (1000 * 60 * 60 * 24));
    let scoreSla = diffDays <= 3 ? 3 : (diffDays <= 7 ? 2 : 1);

    const isIndustrial = (item.category && item.category.endsWith("IND")) || 
                         (item.customer && item.customer.toLowerCase().includes("pt."));
    const scoreCustType = isIndustrial ? 3 : 2;

    const totalScore = (scoreOpRisk * 0.35) + (scoreCustImpact * 0.30) + (scoreSla * 0.20) + (scoreCustType * 0.15);
    const roundedScore = Math.round(totalScore * 100) / 100;

    let level = "rendah";
    if (roundedScore >= 2.40) level = "tinggi";
    else if (roundedScore >= 1.70) level = "sedang";

    return { score: roundedScore, level: level };
  }

  function urgencyLevel(item){ return computeUrgencyMetrics(item).level; }

  function hoursWaiting(item){
    const ms = Date.now() - new Date(item.receivedAt).getTime();
    return Math.max(0, ms / 3600000);
  }

  function priorityScore(item){
    const metrics = computeUrgencyMetrics(item);
    const hrs = Math.min(hoursWaiting(item), 336);
    return (metrics.score * 1000) + hrs;
  }

  function fmtDateTime(dateObj){
    return dateObj.toLocaleString("id-ID", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function fmtDateOnly(dateObj){
    return dateObj.toLocaleString("id-ID", { day:"2-digit", month:"short", year:"numeric" });
  }

  function formatDateKey(d){
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function parseCoords(str){
    if(!str) return null;
    const parts = str.split(",").map(p => parseFloat(p.trim()));
    if(parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])){
      return { lat: parts[0], lng: parts[1] };
    }
    return null;
  }

  function getSLACountdown(receivedAt) {
    const deadline = new Date(new Date(receivedAt).getTime() + SLA_DAYS * 24 * 60 * 60 * 1000);
    const diffMs = deadline - new Date();
    if (diffMs <= 0) return { text: "OVERDUE", isOverdue: true };
    
    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    return { text: `⏳ Sisa ${days}d${hours}h`, isOverdue: false };
  }

  function getDeadlineInfo(item){
    const start = new Date(item.receivedAt);
    const deadline = new Date(start.getTime() + SLA_DAYS * 24 * 60 * 60 * 1000);
    const now = new Date();
    const diffMs = deadline - now;
    const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

    let statusClass = "deadline-normal";
    let statusText = `SLA ${diffDays}hr`;

    if (diffMs < 0) {
      statusClass = "deadline-overdue";
      statusText = `Overdue (${Math.abs(diffDays)}hr)`;
    } else if (diffDays <= 3) {
      statusClass = "deadline-warning";
      statusText = `SLA Urgent (${diffDays}hr)`;
    }

    return {
      receivedText: fmtDateTime(start),
      deadlineText: fmtDateTime(deadline),
      statusClass,
      statusText,
      isOverdue: diffMs < 0
    };
  }

  async function autoAssignMerata() {
    const unassigned = complaints.filter(c => !c.officer && c.status !== "selesai");
    if (unassigned.length === 0) {
      Swal.fire('Info', 'Semua komplain aktif sudah memiliki petugas lapangan!', 'info');
      return;
    }

    const counts = {};
    OFFICERS.forEach(o => counts[o] = 0);
    complaints.forEach(c => {
      if (c.officer && OFFICERS.includes(c.officer) && c.status !== "selesai") {
        counts[c.officer]++;
      }
    });

    for (let item of unassigned) {
      let minOfficer = OFFICERS[0];
      let minCount = counts[OFFICERS[0]];

      for (let o of OFFICERS) {
        if (counts[o] < minCount) {
          minCount = counts[o];
          minOfficer = o;
        }
      }

      item.officer = minOfficer;
      counts[minOfficer]++;

      let fullDesc = buildFullDescription(item.desc, item.address, item.phone, item.rescheduledDate, item.officer, item.photoBefore, item.photoAfter);
      try {
        await sb.from(TABLE).update({ description: fullDesc }).eq("id", item.id);
      } catch(e) { console.error(e); }
    }

    Swal.fire('Berhasil', `Berhasil membagikan ${unassigned.length} Work Order secara merata ke petugas!`, 'success');
    await load();
  }

  function calculateCalendarSchedule(){
    const dateMap = {}; 
    const itemScheduledDateMap = {};

    const completedItems = complaints.filter(c => c.status === "selesai");
    completedItems.forEach(item => {
      const dateKey = formatDateKey(new Date(item.receivedAt));
      if (!dateMap[dateKey]) dateMap[dateKey] = [];
      dateMap[dateKey].push(item);
      itemScheduledDateMap[item.id] = new Date(item.receivedAt);
    });

    const rescheduledItems = complaints.filter(c => c.status !== "selesai" && c.rescheduledDate);
    rescheduledItems.forEach(item => {
      const dateKey = formatDateKey(new Date(item.rescheduledDate));
      if (!dateMap[dateKey]) dateMap[dateKey] = [];
      dateMap[dateKey].push(item);
      itemScheduledDateMap[item.id] = new Date(item.rescheduledDate);
    });

    let unassigned = complaints
      .filter(c => c.status !== "selesai" && !c.rescheduledDate)
      .sort((a,b) => priorityScore(b) - priorityScore(a));

    let currentDate = getNextWorkingDay(new Date());
    currentDate.setHours(0,0,0,0);

    while (unassigned.length > 0) {
      if (isWeekend(currentDate)) {
        currentDate.setDate(currentDate.getDate() + 1);
        continue;
      }

      const dateKey = formatDateKey(currentDate);
      if (!dateMap[dateKey]) dateMap[dateKey] = [];

      let availableSlots = MAX_PER_DAY - dateMap[dateKey].length;
      if (availableSlots <= 0) {
        currentDate.setDate(currentDate.getDate() + 1);
        continue;
      }

      const seedItem = unassigned[0];
      const targetArea = (seedItem.area || "TANPA-AREA").trim().toLowerCase();

      const sameAreaItems = unassigned.filter(i => (i.area || "TANPA-AREA").trim().toLowerCase() === targetArea);
      const otherAreaItems = unassigned.filter(i => (i.area || "TANPA-AREA").trim().toLowerCase() !== targetArea);

      const batchForToday = sameAreaItems.slice(0, availableSlots);
      const remainingSameArea = sameAreaItems.slice(availableSlots);

      batchForToday.forEach(item => {
        let targetWorkingDate = new Date(currentDate);
        if (isWeekend(new Date(item.receivedAt))) {
          targetWorkingDate = getNextWorkingDay(new Date(item.receivedAt));
        }

        dateMap[dateKey].push(item);
        itemScheduledDateMap[item.id] = targetWorkingDate;
      });

      unassigned = [...remainingSameArea, ...otherAreaItems].sort((a,b) => priorityScore(b) - priorityScore(a));

      if (dateMap[dateKey].length >= MAX_PER_DAY) {
        currentDate.setDate(currentDate.getDate() + 1);
      }
    }

    return { dateMap, itemScheduledDateMap };
  }

  function buildFullDescription(desc, address, phone, reschedDate, officer, photoBefore, photoAfter) {
    let result = desc || "";
    if (address) result += ` [Alamat: ${address}]`;
    if (phone) result += ` [WA: ${phone}]`;
    if (reschedDate) result += ` [Resched: ${reschedDate}]`;
    if (officer) result += ` [Petugas: ${officer}]`;
    if (photoBefore) result += ` [Before: ${photoBefore}]`;
    if (photoAfter) result += ` [After: ${photoAfter}]`;
    return result;
  }

  function rowToItem(row){
    let extraAddr = row.address || "";
    let extraMeter = row.meter_id || "";
    let extraPhone = row.phone || "";
    let extraOfficer = "";
    let reschedDate = null;
    let photoBefore = null;
    let photoAfter = null;

    if (row.description) {
      if (row.description.includes("[Alamat:")) {
        const mAddr = row.description.match(/\[Alamat:\s*(.*?)\]/);
        if (mAddr) extraAddr = mAddr[1];
      }
      if (row.description.includes("[WA:")) {
        const mPhone = row.description.match(/\[WA:\s*(.*?)\]/);
        if (mPhone) extraPhone = mPhone[1];
      }
      if (row.description.includes("[Resched:")) {
        const mResched = row.description.match(/\[Resched:\s*(.*?)\]/);
        if (mResched) reschedDate = mResched[1];
      }
      if (row.description.includes("[Petugas:")) {
        const mOff = row.description.match(/\[Petugas:\s*(.*?)\]/);
        if (mOff) extraOfficer = mOff[1];
      }
      if (row.description.includes("[Before:")) {
        const mBef = row.description.match(/\[Before:\s*(.*?)\]/);
        if (mBef) photoBefore = mBef[1];
      }
      if (row.description.includes("[After:")) {
        const mAft = row.description.match(/\[After:\s*(.*?)\]/);
        if (mAft) photoAfter = mAft[1];
      }
    }

    if (!extraMeter && row.customer && row.customer.includes("(") && row.customer.includes(")")) {
      const mId = row.customer.match(/\((.*?)\)/);
      if (mId) extraMeter = mId[1];
    }

    return {
      id: row.id,
      customer: row.customer ? row.customer.replace(/\s*\(.*?\)/, '') : "",
      phone: extraPhone,
      meterId: extraMeter,
      address: extraAddr,
      area: row.area,
      category: row.category,
      desc: row.description ? row.description.replace(/\[Alamat:.*?\]/g, '').replace(/\[WA:.*?\]/g, '').replace(/\[Resched:.*?\]/g, '').replace(/\[Petugas:.*?\]/g, '').replace(/\[Before:.*?\]/g, '').replace(/\[After:.*?\]/g, '').trim() : "",
      receivedAt: row.received_at,
      urgent: row.urgent,
      coords: row.coords,
      status: row.status,
      rescheduledDate: reschedDate,
      officer: extraOfficer,
      photoBefore: photoBefore,
      photoAfter: photoAfter,
      createdAt: row.created_at,
    };
  }

    try {
      let receivedDateObj = (data && data.receivedAt) ? new Date(data.receivedAt) : new Date();
      if (isWeekend(receivedDateObj)) {
        receivedDateObj = getNextWorkingDay(receivedDateObj);
      }

      const item = {
        id: "WO-" + Date.now().toString().slice(-6),
        customer: (data && data.customer) ? data.customer : "Pelanggan Tanpa Nama",
        phone: (data && data.phone) ? data.phone : "",
        meterId: (data && data.meterId) ? data.meterId : "",
        address: (data && data.address) ? data.address : "",
        area: (data && data.area) ? data.area : "Cikupa",
        category: (data && data.category) ? data.category : "KBSM",
        desc: (data && data.desc) ? data.desc : "",
        officer: "",
        receivedAt: receivedDateObj.toISOString(),
        urgent: !!(data && data.urgent),
        coords: (data && data.coords) ? data.coords : "",
        status: "baru",
      };

      let fullDesc = buildFullDescription(item.desc, item.address, item.phone, null, item.officer, null, null);
      const fullCust = item.meterId ? `${item.customer} (${item.meterId})` : item.customer;

      const fullPayload = {
        id: item.id,
        customer: fullCust,
        phone: item.phone || null,
        meter_id: item.meterId || null,
        address: item.address || null,
        area: item.area,
        category: item.category,
        description: fullDesc,
        received_at: item.receivedAt,
        urgent: item.urgent,
        coords: item.coords,
        status: item.status
      };

      await sb.from(TABLE).insert(fullPayload);
      complaints.push(item);
    } catch(globalErr) { console.error("Error addComplaint:", globalErr); } 
    finally { await load(); }
  }

        try{ await sb.from(TABLE).delete().eq("id", id); } catch(e){}
        await load();
        Swal.fire('Terhapus!', 'WO berhasil dihapus.', 'success');
      }
    });
  }

  async function processInboundEmail(emailRawText) {
    if (!emailRawText.trim()) return;

    const parseField = (pattern) => {
      const match = emailRawText.match(pattern);
      return match ? match[1].trim() : null;
    };

    const customer = parseField(/Nama Pelanggan\s*:\s*(.*)/i) || parseField(/Pelanggan\s*:\s*(.*)/i) || "Pelanggan Inbound Email";
    const phone = parseField(/No WhatsApp\s*:\s*(.*)/i) || parseField(/No HP\s*:\s*(.*)/i) || "";
    const meterId = parseField(/ID Meter\s*:\s*(.*)/i) || parseField(/ID Pelanggan\s*:\s*(.*)/i) || "-";
    const address = parseField(/Alamat\s*:\s*(.*)/i) || "-";
    const area = parseField(/Area\s*:\s*(.*)/i) || "Cikupa";
    const coords = parseField(/Koordinat\s*:\s*(.*)/i) || "";
    const desc = parseField(/Deskripsi\s*:\s*(.*)/i) || emailRawText.slice(0, 150);

    let detectedCategory = parseField(/Jenis Case\s*:\s*(.*)/i) || parseField(/Case\s*:\s*(.*)/i);
    if (!detectedCategory || !CATEGORIES.some(c => c.key === detectedCategory.toUpperCase())) {
      const lowerText = (desc + " " + emailRawText).toLowerCase();
      let matched = CATEGORIES.find(c => c.keywords.some(kw => lowerText.includes(kw)));
      detectedCategory = matched ? matched.key : "KBSM";
    }

    const newComplaint = {
      customer, phone, meterId, address, area,
      category: detectedCategory.toUpperCase(),
      desc: desc + " [Konversi Email Otomatis]",
      receivedAt: new Date().toISOString(), urgent: false, coords
    };

    await addComplaint(newComplaint);
  }

  async function load(){
    try{
      const { data, error } = await sb.from(TABLE).select("*").order("created_at", { ascending: true });
      if(error) throw error;
      if (data && data.length > 0) complaints = data.map(rowToItem);
    }catch(e){ console.error(e); }
    render();
  }

  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c => {
      if(c === null || c === undefined) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,16);
  }

  function renderFinishModal(){
    if (!finishModalOpen || !finishTargetId) return el("div");

    let photoBeforeData = null;
    let photoAfterData = null;

    const target = complaints.find(c => c.id === finishTargetId);
    if (target) {
      photoBeforeData = target.photoBefore || null;
      photoAfterData = target.photoAfter || null;
    }

    function handleImageFile(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    const camBeforeInput = el("input", { type: "file", accept: "image/*", capture: "environment", style: "display:none;" });
    const fileBeforeInput = el("input", { type: "file", accept: "image/*", style: "display:none;" });
    const imgBeforePreview = el("img", { class: "photo-preview-img", src: photoBeforeData || "" });
    if(photoBeforeData) imgBeforePreview.style.display = "block";

    camBeforeInput.onchange = (e) => handleImageFile(e.target.files[0], (url) => { photoBeforeData = url; imgBeforePreview.src = url; imgBeforePreview.style.display = "block"; });
    fileBeforeInput.onchange = (e) => handleImageFile(e.target.files[0], (url) => { photoBeforeData = url; imgBeforePreview.src = url; imgBeforePreview.style.display = "block"; });

    const camAfterInput = el("input", { type: "file", accept: "image/*", capture: "environment", style: "display:none;" });
    const fileAfterInput = el("input", { type: "file", accept: "image/*", style: "display:none;" });
    const imgAfterPreview = el("img", { class: "photo-preview-img", src: photoAfterData || "" });
    if(photoAfterData) imgAfterPreview.style.display = "block";

    camAfterInput.onchange = (e) => handleImageFile(e.target.files[0], (url) => { photoAfterData = url; imgAfterPreview.src = url; imgAfterPreview.style.display = "block"; });
    fileAfterInput.onchange = (e) => handleImageFile(e.target.files[0], (url) => { photoAfterData = url; imgAfterPreview.src = url; imgAfterPreview.style.display = "block"; });

    const canvas = el("canvas", { class: "signature-pad", width: 340, height: 120, style: "touch-action: none;" });
    const ctx = canvas.getContext("2d");

    let drawing = false;
    let hasSignature = false;

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      drawing = true;
      hasSignature = true;
      const pos = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      if (e.cancelable) e.preventDefault();
    }

    function draw(e) {
      if (!drawing) return;
      const pos = getCoords(e);
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = isDarkMode ? "#38BDF8" : "#0F172A";
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      if (e.cancelable) e.preventDefault();
    }

    function stopDrawing() { drawing = false; ctx.beginPath(); }

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);

    canvas.addEventListener("touchstart", startDrawing, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDrawing);

    return el("div", { class: "form-panel open", style: "background:var(--panel); border:1px solid var(--accent);" },
      el("h2", { style: "margin-top:0;" }, `📸 Bukti Pengerjaan & Tanda Tangan (${finishTargetId})`),
      
      el("div", { class: "field-row" },
        el("div", { class: "field" },
          el("label", {}, "Foto Sebelum (Before):"),
          el("div", { class: "photo-upload-box" },
            imgBeforePreview,
            el("div", { class: "photo-btn-group" },
              el("label", { class: "btn-cam", onclick: () => camBeforeInput.click() }, "📷 Kamera"),
              el("label", { class: "btn-file", onclick: () => fileBeforeInput.click() }, "📁 File"),
              camBeforeInput, fileBeforeInput
            )
          )
        ),
        el("div", { class: "field" },
          el("label", {}, "Foto Sesudah (After):"),
          el("div", { class: "photo-upload-box" },
            imgAfterPreview,
            el("div", { class: "photo-btn-group" },
              el("label", { class: "btn-cam", onclick: () => camAfterInput.click() }, "📷 Kamera"),
              el("label", { class: "btn-file", onclick: () => fileAfterInput.click() }, "📁 File"),
              camAfterInput, fileAfterInput
            )
          )
        )
      ),

      el("div", { class: "field", style: "margin-bottom:10px; margin-top:6px;" },
        el("label", {}, "Tanda Tangan Pelanggan Digital:"),
        canvas,
        el("button", { 
          class: "btn-secondary", 
          style: "width:100px; margin-top:4px; font-size:10px;", 
          onclick: () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSignature = false;
          } 
        }, "🧹 Hapus TTD")
      ),
      
      el("div", { style: "display:flex; gap:8px;" },
        el("button", { class: "btn-primary", onclick: async () => {
          if (!hasSignature) {
            Swal.fire('Peringatan', 'Harap bubuhkan tanda tangan pelanggan terlebih dahulu!', 'warning');
            return;
          }

          if (target) {
            target.status = "selesai";
            target.photoBefore = photoBeforeData;
            target.photoAfter = photoAfterData;
            let fullDesc = buildFullDescription(target.desc, target.address, target.phone, target.rescheduledDate, target.officer, target.photoBefore, target.photoAfter);
            
            await sb.from(TABLE).update({ status: "selesai", description: fullDesc }).eq("id", target.id);
          }
          finishModalOpen = false;
          Swal.fire('Selesai!', 'Work Order telah diselesaikan, bukti foto & TTD terverifikasi.', 'success');
          await load();
        }}, "Verifikasi & Selesai"),
        el("button", { class: "btn-secondary", onclick: () => { finishModalOpen = false; render(); } }, "Batal")
      )
    );
  }
