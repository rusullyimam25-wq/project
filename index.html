<style>
  :root {
    --bg: #F8FAFC;
    --panel: #FFFFFF;
    --border: #E2E8F0;
    --border-hover: #CBD5E1;
    --ink: #0F172A;
    --ink-soft: #64748B;
    --ink-muted: #94A3B8;
    
    --accent: #2563EB;
    --accent-bg: #EFF6FF;
    --accent-hover: #1D4ED8;
    
    --tinggi: #EF4444;
    --tinggi-bg: #FEF2F2;
    --sedang: #F59E0B;
    --sedang-bg: #FFFBEB;
    --rendah: #10B981;
    --rendah-bg: #ECFDF5;
    
    --wa: #25D366;
    --wa-bg: #DCF8C6;
    --wa-hover: #1EBE5D;

    --resched: #7C3AED;
    --resched-bg: #F3E8FF;
    
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }

  #app-root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  
  .wrap { max-width: 1180px; margin: 0 auto; }

  /* Header Logo */
  .masthead {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding: 14px 20px; background: var(--panel);
    border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  }
  .brand-group { display: flex; align-items: center; gap: 14px; }
  .brand-logo { height: 42px; width: auto; object-fit: contain; }
  .brand-title h1 { font-size: 18px; font-weight: 800; margin: 0; color: var(--ink); letter-spacing: -0.02em; }
  .brand-title .unit { font-size: 12px; color: var(--accent); font-weight: 700; }

  /* Layout Grid */
  .dashboard-grid {
    display: grid; grid-template-columns: 1fr 340px; gap: 20px;
  }
  @media (max-width: 900px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }

  /* Widget Kalender Sidebar */
  .calendar-card {
    background: #0F172A; border-radius: var(--radius);
    padding: 18px; box-shadow: var(--shadow-md); color: #F8FAFC; position: sticky; top: 20px;
  }
  .cal-top-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; font-weight: 700; color: #38BDF8; padding-bottom: 10px; margin-bottom: 12px;
    border-bottom: 1px solid #334155;
  }
  .cal-month-nav {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  }
  .cal-month-title { font-size: 14px; font-weight: 700; color: #F8FAFC; }
  .cal-nav-btns { display: flex; gap: 6px; }
  .cal-nav-btn {
    background: #1E293B; border: 1px solid #334155; font-size: 12px; cursor: pointer; color: #94A3B8; padding: 4px 8px; border-radius: 4px;
  }
  .cal-nav-btn:hover { color: #FFF; background: #334155; }

  .cal-grid-embedded {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;
  }
  .cal-head-cell { font-size: 11px; font-weight: 700; color: #94A3B8; padding: 4px 0; text-transform: uppercase; }
  .cal-date-cell {
    padding: 6px 0; font-size: 13px; font-weight: 600; color: #E2E8F0;
    border-radius: 50%; width: 32px; height: 32px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative; transition: all 0.2s;
  }
  .cal-date-cell:hover { background: #334155; }
  .cal-date-cell.other-month { color: #475569; }
  .cal-date-cell.selected {
    background: #38BDF8 !important; color: #0F172A !important; font-weight: 800;
  }
  .cal-date-cell.has-tasks::after {
    content: ""; display: block; width: 4px; height: 4px; background: #38BDF8;
    border-radius: 50%; position: absolute; bottom: 2px;
  }
  .cal-date-cell.selected.has-tasks::after { background: #0F172A; }
  .cal-date-cell.has-high::after { background: var(--tinggi); }
  .cal-date-cell.all-done::after { background: var(--rendah); }

  /* Kuota Control Card */
  .quota-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-top: 16px; box-shadow: var(--shadow-sm);
  }
  .quota-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }

  /* Grafik & Analisa Card */
  .chart-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .chart-header h3 { font-size: 14px; font-weight: 700; margin: 0; color: var(--ink); }
  .chart-header .total-badge { background: var(--accent-bg); color: var(--accent); font-weight: 700; font-size: 11px; padding: 4px 10px; border-radius: 20px; }
  
  .chart-list { display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; padding-right: 4px; }
  .chart-item { font-size: 12px; }
  .chart-label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; color: var(--ink-soft); }
  .chart-bar-bg { background: #F1F5F9; border-radius: 6px; height: 8px; width: 100%; overflow: hidden; }
  .chart-bar-fill { background: linear-gradient(90deg, #2563EB, #06B6D4); height: 100%; border-radius: 6px; transition: width 0.3s; }

  .analytics-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border);
  }
  .analytics-box { background: #F8FAFC; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); }
  .analytics-box .val { font-size: 16px; font-weight: 800; color: var(--ink); }
  .analytics-box .lbl { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }

  /* Stats Summary Cards */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow-sm); border-top: 4px solid var(--accent);
  }
  .stat-card .num { font-size: 26px; font-weight: 800; color: var(--ink); letter-spacing: -0.03em; }
  .stat-card .lbl { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-top: 4px; }
  
  .stat-card.tinggi { border-top-color: var(--tinggi); }
  .stat-card.tinggi .num { color: var(--tinggi); }
  .stat-card.selesai-stat { border-top-color: var(--rendah); }
  .stat-card.selesai-stat .num { color: var(--rendah); }

  /* Search & Filter Bar */
  .search-bar {
    display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
  }
  .search-input {
    flex: 1; min-width: 200px; padding: 9px 14px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; background: var(--panel); outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .quick-badge {
    font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); color: var(--ink-soft); transition: all 0.2s;
  }
  .quick-badge:hover, .quick-badge.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }

  /* Toolbar */
  .toolbar {
    display: flex; gap: 12px; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filter-group { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }

  select {
    font-size: 12.5px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--ink); outline: none; max-width: 220px; font-weight: 500; cursor: pointer;
  }

  button { font-family: inherit; cursor: pointer; border: none; font-size: 12.5px; font-weight: 600; border-radius: 8px; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: #fff; padding: 9px 16px; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--panel); border: 1px solid var(--border); color: var(--ink); padding: 8px 14px; }
  .btn-secondary:hover { background: #F8FAFC; }
  .btn-email { background: #8B5CF6; color: #FFF; padding: 9px 16px; box-shadow: 0 2px 4px rgba(139, 92, 246, 0.2); }
  .btn-email:hover { background: #7C3AED; }
  .btn-history { background: #0284C7; color: #FFF; padding: 9px 16px; box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2); }
  .btn-history:hover { background: #0369A1; }
  .btn-excel { background: #10B981; color: #FFF; padding: 9px 16px; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2); }
  .btn-excel:hover { background: #059669; }
  .btn-text { background: none; color: var(--ink-soft); font-weight: 500; text-decoration: underline; padding: 4px; }

  /* Form Panels */
  .form-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow-md); display: none;
  }
  .form-panel.open { display: block; }
  .form-panel h2 { font-size: 15px; font-weight: 700; margin: 0 0 16px; color: var(--ink); }
  .field-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    font-family: inherit; font-size: 12.5px; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 6px; outline: none;
  }
  .field textarea { resize: vertical; min-height: 55px; }

  /* Cards Ticket Modern */
  .ticket {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .ticket:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .ticket::before { content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; }
  .ticket.tinggi::before { background: var(--tinggi); }
  .ticket.sedang::before { background: var(--sedang); }
  .ticket.rendah::before { background: var(--rendah); }
  .ticket.selesai { opacity: 0.7; background: #F8FAFC; }

  .ticket-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .ticket-id { font-size: 12px; font-weight: 700; color: var(--accent); }
  .ticket-cust { font-size: 15px; font-weight: 700; color: var(--ink); margin-top: 2px; }
  .ticket-meter { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  
  .ticket-badge { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; }
  .badge-tinggi { background: var(--tinggi-bg); color: var(--tinggi); }
  .badge-sedang { background: var(--sedang-bg); color: var(--sedang); }
  .badge-rendah { background: var(--rendah-bg); color: var(--rendah); }
  .badge-selesai { background: #E2E8F0; color: #475569; }

  .case-tag { background: #E0F2FE; color: #0369A1; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-right: 6px; }
  .area-tag { background: #FEF3C7; color: #92400E; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-right: 6px; }
  .score-badge { background: #1E293B; color: #38BDF8; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-right: 6px; }
  .resched-badge { background: var(--resched-bg); color: var(--resched); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-right: 6px; }

  .ticket-address { font-size: 12px; color: #475569; background: #F8FAFC; padding: 6px 10px; border-radius: 6px; border-left: 3px solid var(--accent); margin-top: 2px; }
  .ticket-desc { font-size: 13px; color: var(--ink); line-height: 1.4; }

  .schedule-box {
    background: #F8FAFC; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 4px;

  .schedule-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .schedule-title { font-weight: 700; color: var(--accent); }
  .deadline-tag { font-weight: 700; padding: 2px 8px; border-radius: 4px; font-size: 10.5px; }
  .deadline-normal { background: #E2E8F0; color: #334155; }
  .deadline-warning { background: var(--sedang-bg); color: var(--sedang); }
  .deadline-overdue { background: var(--tinggi-bg); color: var(--tinggi); }

  .ticket-map-container { width: 100%; height: 130px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-top: 4px; z-index: 1; }
  .ticket-loc { font-size: 12px; display: flex; gap: 12px; margin-top: 4px; }
  .ticket-loc a { color: var(--accent); text-decoration: none; font-weight: 600; }

  .ticket-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
  .ticket-actions button { font-size: 11.5px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: #FFF; color: var(--ink-soft); }
  .ticket-actions button.progress { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .ticket-actions button.done { border-color: var(--rendah); color: var(--rendah); background: var(--rendah-bg); }
  .ticket-actions button.resched-btn { border-color: var(--resched); color: var(--resched); background: var(--resched-bg); }
  .ticket-actions button.del { margin-left: auto; border-color: transparent; color: var(--ink-muted); }
  .ticket-actions button.del:hover { color: var(--tinggi); background: var(--tinggi-bg); }
  
  .btn-wa {
    background: var(--wa) !important; color: #FFF !important; border: none !important;
    display: inline-flex; align-items: center; gap: 6px; font-weight: 700 !important;
    text-decoration: none; font-size: 11.5px; padding: 6px 12px; border-radius: 6px;
    transition: background 0.2s;
  }
  .btn-wa:hover { background: var(--wa-hover) !important; }

  .section-head {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-soft); margin: 20px 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-head .count { background: #E2E8F0; color: var(--ink); font-size: 11px; font-weight: 700; border-radius: 12px; padding: 2px 8px; }
  .empty { text-align: center; padding: 24px; color: var(--ink-soft); font-size: 13px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--panel); }
  
  .filter-date-banner {
    background: #E0F2FE; border: 1px solid #38BDF8; color: #0369A1;
    padding: 10px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }

  .history-item { background: #F8FAFC; border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; }
</style>

  function catInfo(key){
    return CATEGORIES.find(c => c.key === key) || { key: key||"OTHERS", label: key||"Lainnya", opRisk: 1, custImpact: 1, keywords:[] };
  }

  function formatWA(phoneStr) {
    if (!phoneStr) return "";
    let clean = phoneStr.replace(/[^0-9]/g, '');
    if (clean.startsWith('0')) {
      clean = '62' + clean.slice(1);
    }
    return clean;
  }

  function computeUrgencyMetrics(item) {
    const cInfo = catInfo(item.category);

    const scoreOpRisk = item.urgent ? 3 : (cInfo.opRisk || 1);
    const scoreCustImpact = item.urgent ? 3 : (cInfo.custImpact || 1);

    const start = new Date(item.receivedAt);
    const deadline = new Date(start.getTime() + SLA_DAYS * 24 * 60 * 60 * 1000);
    const diffDays = Math.ceil((deadline - new Date()) / (1000 * 60 * 60 * 24));
    let scoreSla = 1;
    if (diffDays <= 3) scoreSla = 3;
    else if (diffDays <= 7) scoreSla = 2;

    const isIndustrial = (item.category && item.category.endsWith("IND")) || 
                         (item.customer && item.customer.toLowerCase().includes("pt.")) ||
                         (item.customer && item.customer.toLowerCase().includes("cv."));
    const scoreCustType = isIndustrial ? 3 : 2;

    const totalScore = (scoreOpRisk * 0.35) + (scoreCustImpact * 0.30) + (scoreSla * 0.20) + (scoreCustType * 0.15);
    const roundedScore = Math.round(totalScore * 100) / 100;

    let level = "rendah";
    if (roundedScore >= 2.40) level = "tinggi";
    else if (roundedScore >= 1.70) level = "sedang";

    return {
      score: roundedScore,
      level: level
    };
  }

  function urgencyLevel(item){
    return computeUrgencyMetrics(item).level;
  }

  function hoursWaiting(item){
    const ms = Date.now() - new Date(item.receivedAt).getTime();
    return Math.max(0, ms / 3600000);
  }

  function priorityScore(item){
    const metrics = computeUrgencyMetrics(item);
    const hrs = Math.min(hoursWaiting(item), 336);
    return (metrics.score * 1000) + hrs;
  }

  function fmtWait(item){
    const hrs = hoursWaiting(item);
    if (hrs < 1) return Math.round(hrs*60) + " menit menunggu";
    const h = Math.floor(hrs);
    const m = Math.round((hrs - h) * 60);
    return h + "j " + (m>0? m+"m ":"") + "menunggu";
  }

  function fmtDateTime(dateObj){
    return dateObj.toLocaleString("id-ID", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function fmtDateOnly(dateObj){
    return dateObj.toLocaleString("id-ID", { day:"2-digit", month:"short", year:"numeric" });
  }

  function formatDateKey(d){
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function parseCoords(str){
    if(!str) return null;
    const parts = str.split(",").map(p => parseFloat(p.trim()));
    if(parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])){
      return { lat: parts[0], lng: parts[1] };
    }
    return null;
  }

  function getDeadlineInfo(item){
    const start = new Date(item.receivedAt);
    const deadline = new Date(start.getTime() + SLA_DAYS * 24 * 60 * 60 * 1000);
    const now = new Date();
    const diffMs = deadline - now;
    const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

    let statusClass = "deadline-normal";
    let statusText = `Sisa ${diffDays} hari`;

    if (diffMs < 0) {
      statusClass = "deadline-overdue";
      statusText = `Terlambat (${Math.abs(diffDays)} hari)`;
    } else if (diffDays <= 3) {
      statusClass = "deadline-warning";
      statusText = `Mendesak (${diffDays} hari lagi)`;
    }

    return {
      receivedText: fmtDateTime(start),
      deadlineText: fmtDateTime(deadline),
      statusClass,
      statusText
    };
  }

  function calculateCalendarSchedule(){
    const dateMap = {}; 
    const itemScheduledDateMap = {};

    const completedItems = complaints.filter(c => c.status === "selesai");
    completedItems.forEach(item => {
      const dateKey = formatDateKey(new Date(item.receivedAt));
      if (!dateMap[dateKey]) dateMap[dateKey] = [];
      dateMap[dateKey].push(item);
      itemScheduledDateMap[item.id] = new Date(item.receivedAt);
    });

    const rescheduledItems = complaints.filter(c => c.status !== "selesai" && c.rescheduledDate);
    rescheduledItems.forEach(item => {
      const dateKey = formatDateKey(new Date(item.rescheduledDate));
      if (!dateMap[dateKey]) dateMap[dateKey] = [];
      dateMap[dateKey].push(item);
      itemScheduledDateMap[item.id] = new Date(item.rescheduledDate);
    });

    let unassigned = complaints
      .filter(c => c.status !== "selesai" && !c.rescheduledDate)
      .sort((a,b) => {
        const scoreA = priorityScore(a);
        const scoreB = priorityScore(b);
        if (scoreB !== scoreA) return scoreB - scoreA;
        return new Date(a.receivedAt) - new Date(b.receivedAt);
      });

    let currentDate = new Date();
    currentDate.setHours(0,0,0,0);

    while (unassigned.length > 0) {
      const dateKey = formatDateKey(currentDate);
      if (!dateMap[dateKey]) dateMap[dateKey] = [];

      let availableSlots = MAX_PER_DAY - dateMap[dateKey].length;

      if (availableSlots <= 0) {
        currentDate.setDate(currentDate.getDate() + 1);
        continue;
      }

      const seedItem = unassigned[0];
      const targetArea = (seedItem.area || "TANPA-AREA").trim().toLowerCase();

      const sameAreaItems = [];
      const otherAreaItems = [];

      unassigned.forEach(item => {
        const itemArea = (item.area || "TANPA-AREA").trim().toLowerCase();
        if (itemArea === targetArea) {
          sameAreaItems.push(item);
        } else {
          otherAreaItems.push(item);
        }
      });

      const batchForToday = sameAreaItems.slice(0, availableSlots);
      const remainingSameArea = sameAreaItems.slice(availableSlots);

      batchForToday.forEach(item => {
        dateMap[dateKey].push(item);
        itemScheduledDateMap[item.id] = new Date(currentDate);
      });

      unassigned = [...remainingSameArea, ...otherAreaItems].sort((a,b) => {
        const scoreA = priorityScore(a);
        const scoreB = priorityScore(b);
        if (scoreB !== scoreA) return scoreB - scoreA;
        return new Date(a.receivedAt) - new Date(b.receivedAt);
      });

      if (dateMap[dateKey].length >= MAX_PER_DAY) {
        currentDate.setDate(currentDate.getDate() + 1);
      }
    }

    return { dateMap, itemScheduledDateMap };
  }

  function rowToItem(row){
    let extraAddr = row.address || "";
    let extraMeter = row.meter_id || "";
    let extraPhone = row.phone || "";
    let reschedDate = null;

    if (!extraAddr && row.description && row.description.includes("[Alamat:")) {
      const mAddr = row.description.match(/\[Alamat:\s*(.*?)\]/);
      if (mAddr) extraAddr = mAddr[1];
    }
    if (!extraPhone && row.description && row.description.includes("[WA:")) {
      const mPhone = row.description.match(/\[WA:\s*(.*?)\]/);
      if (mPhone) extraPhone = mPhone[1];
    }
    if (row.description && row.description.includes("[Resched:")) {
      const mResched = row.description.match(/\[Resched:\s*(.*?)\]/);
      if (mResched) reschedDate = mResched[1];
    }
    if (!extraMeter && row.customer && row.customer.includes("(") && row.customer.includes(")")) {
      const mId = row.customer.match(/\((.*?)\)/);
      if (mId) extraMeter = mId[1];
    }

    return {
      id: row.id,
      customer: row.customer ? row.customer.replace(/\s*\(.*?\)/, '') : "",
      phone: extraPhone,
      meterId: extraMeter,
      address: extraAddr,
      area: row.area,
      category: row.category,
      desc: row.description ? row.description.replace(/\[Alamat:.*?\]/g, '').replace(/\[WA:.*?\]/g, '').replace(/\[Resched:.*?\]/g, '').trim() : "",
      receivedAt: row.received_at,
      urgent: row.urgent,
      coords: row.coords,
      status: row.status,
      rescheduledDate: reschedDate,
      createdAt: row.created_at,
    };
  }

  async function addComplaint(data){
    try {
      const item = {
        id: "WO-" + Date.now().toString().slice(-6),
        customer: (data && data.customer) ? data.customer : "Pelanggan Tanpa Nama",
        phone: (data && data.phone) ? data.phone : "",
        meterId: (data && data.meterId) ? data.meterId : "",
        address: (data && data.address) ? data.address : "",
        area: (data && data.area) ? data.area : "Cikupa",
        category: (data && data.category) ? data.category : "KBSM",
        desc: (data && data.desc) ? data.desc : "",
        receivedAt: (data && data.receivedAt) ? data.receivedAt : new Date().toISOString(),
        urgent: !!(data && data.urgent),
        coords: (data && data.coords) ? data.coords : "",
        status: "baru",
      };

      let fullDesc = item.desc;
      if (item.address) fullDesc += ` [Alamat: ${item.address}]`;
      if (item.phone) fullDesc += ` [WA: ${item.phone}]`;
      const fullCust = item.meterId ? `${item.customer} (${item.meterId})` : item.customer;

      const fullPayload = {
        id: item.id,
        customer: fullCust,
        phone: item.phone || null,
        meter_id: item.meterId || null,
        address: item.address || null,
        area: item.area,
        category: item.category,
        description: fullDesc,
        received_at: item.receivedAt,
        urgent: item.urgent,
        coords: item.coords,
        status: item.status
      };

      const fallbackPayload = {
        id: item.id,
        customer: fullCust,
        area: item.area,
        category: item.category,
        description: fullDesc,
        received_at: item.receivedAt,
        urgent: item.urgent,
        coords: item.coords,
        status: item.status
      };

      let isSuccess = false;
      try {
        const { error } = await sb.from(TABLE).insert(fullPayload);
        if (!error) isSuccess = true;
      } catch(err) {
        console.warn("Retrying insert with fallback schema...", err);
      }

      if (!isSuccess) {
        try {
          const { error: err2 } = await sb.from(TABLE).insert(fallbackPayload);
          if (!err2) isSuccess = true;
        } catch(err2) {
          console.warn("Supabase insertion failed, keeping data locally:", err2);
        }
      }

      complaints.push(item);
    } catch(globalErr) {
      console.error("Error pada fungsi addComplaint:", globalErr);
    } finally {
      await load();
    }
  }

  async function markAbsentAndReschedule(id) {
    const target = complaints.find(c => c.id === id);
    if (!target) return;

    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = formatDateKey(tomorrow);

    target.rescheduledDate = tomorrowStr;

    let fullDesc = target.desc;
    if (target.address) fullDesc += ` [Alamat: ${target.address}]`;
    if (target.phone) fullDesc += ` [WA: ${target.phone}]`;
    fullDesc += ` [Resched: ${tomorrowStr}]`;

    try {
      await sb.from(TABLE).update({
        description: fullDesc
      }).eq("id", id);
    } catch(e) {
      console.error(e);
    }

    await load();
  }

    const fullCust = data.meterId ? `${data.customer} (${data.meterId})` : data.customer;

    try{
      const { error } = await sb.from(TABLE).update({

        phone: data.phone || null,

        category: data.category,
        description: fullDesc,
        received_at: data.receivedAt,

      }).eq("id", id);
      if(error){
        await sb.from(TABLE).update({

          description: fullDesc,

  async function processInboundEmail(emailRawText) {
    if (!emailRawText.trim()) return;

    const parseField = (pattern) => {
      const match = emailRawText.match(pattern);
      return match ? match[1].trim() : null;
    };

    const customer = parseField(/Nama Pelanggan\s*:\s*(.*)/i) || parseField(/Pelanggan\s*:\s*(.*)/i) || "Pelanggan Forward Email";
    const phone = parseField(/No WhatsApp\s*:\s*(.*)/i) || parseField(/No Telepon\s*:\s*(.*)/i) || parseField(/No HP\s*:\s*(.*)/i) || "";
    const meterId = parseField(/ID Meter\s*:\s*(.*)/i) || parseField(/ID Pelanggan\s*:\s*(.*)/i) || "-";
    const address = parseField(/Alamat\s*:\s*(.*)/i) || "-";
    const area = parseField(/Area\s*:\s*(.*)/i) || "Cikupa";
    const coords = parseField(/Koordinat\s*:\s*(.*)/i) || "";
    const desc = parseField(/Deskripsi\s*:\s*(.*)/i) || emailRawText.slice(0, 150);
    const urgentFlag = parseField(/Urgent\s*:\s*(.*)/i);
    const isUrgent = urgentFlag ? urgentFlag.toLowerCase().includes("ya") : false;

    let detectedCategory = parseField(/Jenis Case\s*:\s*(.*)/i);
    if (!detectedCategory || !CATEGORIES.some(c => c.key === detectedCategory.toUpperCase())) {
      const lowerText = (desc + " " + emailRawText).toLowerCase();
      let matched = CATEGORIES.find(c => c.keywords.some(kw => lowerText.includes(kw)));
      detectedCategory = matched ? matched.key : "KBSM";
    }

    const newComplaint = {
      customer,
      phone,
      meterId,
      address,
      area,
      category: detectedCategory.toUpperCase(),
      desc: desc + " [Konversi Email Otomatis]",
      receivedAt: new Date().toISOString(),
      urgent: isUrgent,
      coords
    };

    await addComplaint(newComplaint);
  }

  async function load(){
    try{
      const { data, error } = await sb.from(TABLE).select("*").order("created_at", { ascending: true });

      if (data && data.length > 0) {
        complaints = data.map(rowToItem);

      storageOk = true;
    }catch(e){
      console.error("Database connection fallback active:", e);
      storageOk = false;

    render();

  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    children.flat().forEach(c => {
      if(c === null || c === undefined) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  function renderSidebarCalendar(dateMap){
    const selectedKey = selectedDate ? formatDateKey(selectedDate) : null;
    const headerTitle = selectedDate ? selectedDate.toLocaleDateString("id-ID", { weekday: "short", day: "numeric", month: "short" }) : "Semua Tanggal";

    const year = viewMonth.getFullYear();
    const month = viewMonth.getMonth();
    const monthTitle = viewMonth.toLocaleDateString("id-ID", { month: "long", year: "numeric" });

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const prevMonthLastDay = new Date(year, month, 0).getDate();
    const startDayOfWeek = firstDay.getDay();

    const dateCells = [];

    for(let i = startDayOfWeek - 1; i >= 0; i--){
      dateCells.push({ dayNum: prevMonthLastDay - i, isOtherMonth: true });
    }

    for(let d = 1; d <= lastDay.getDate(); d++){
      const fullDate = new Date(year, month, d);
      const key = formatDateKey(fullDate);
      const tasks = dateMap[key] || [];
      const isSelected = key === selectedKey;
      const hasHigh = tasks.some(t => urgencyLevel(t) === "tinggi" && t.status !== "selesai");
      const allDone = tasks.length > 0 && tasks.every(t => t.status === "selesai");

      dateCells.push({
        dayNum: d,
        fullDate,
        key,
        isSelected,
        hasTasks: tasks.length > 0,
        hasHigh,
        allDone,
        isOtherMonth: false
      });
    }

    const remainingSlots = 42 - dateCells.length;
    for(let i = 1; i <= remainingSlots; i++){
      dateCells.push({ dayNum: i, isOtherMonth: true });
    }

    return el("div", { class: "calendar-card" },
      el("div", { class: "cal-top-header" },
        el("span", {}, headerTitle),
        selectedDate ? el("button", { 
          style: "font-size:11px; background:none; border:none; color:#38BDF8; cursor:pointer; font-weight:700;",
          onclick: () => { selectedDate = null; render(); }
        }, "Reset Filter") : null
      ),
      el("div", { class: "cal-month-nav" },
        el("span", { class: "cal-month-title" }, monthTitle),
        el("div", { class: "cal-nav-btns" },
          el("button", { class: "cal-nav-btn", onclick: () => {
            viewMonth.setMonth(viewMonth.getMonth() - 1);
            render();
          }}, "▲"),
          el("button", { class: "cal-nav-btn", onclick: () => {
            viewMonth.setMonth(viewMonth.getMonth() + 1);
            render();
          }}, "▼")
        )
      ),
      el("div", { class: "cal-grid-embedded" },
        ...["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"].map(h => el("div", { class: "cal-head-cell" }, h)),
        ...dateCells.map(c => {
          if (c.isOtherMonth) {
            return el("div", { class: "cal-date-cell other-month" }, String(c.dayNum));
          }
          let classes = "cal-date-cell";
          if (c.isSelected) classes += " selected";
          if (c.hasTasks) classes += " has-tasks";
          if (c.hasHigh) classes += " has-high";
          if (c.allDone) classes += " all-done";

          return el("div", {
            class: classes,
            onclick: () => {
              if (selectedDate && formatDateKey(selectedDate) === c.key) {
                selectedDate = null;
              } else {
                selectedDate = c.fullDate;
              }
              render();
            }
          }, String(c.dayNum));
        })
      ),

      el("div", { class: "quota-card" },
        el("div", { class: "quota-header" },
          el("span", {}, "⚡ Batas Kuota/Hari"),
          el("span", { style: "color:var(--accent);" }, `${MAX_PER_DAY} Kasus`)
        ),
        el("input", {
          type: "range", min: "5", max: "25", value: String(MAX_PER_DAY), style: "width:100%; cursor:pointer;",
          oninput: (e) => {
            MAX_PER_DAY = parseInt(e.target.value, 10);
            render();
          }
        })
      )
    );
  }

  function initMaps(){
    Object.keys(activeMaps).forEach(id => {
      if(activeMaps[id] && activeMaps[id].remove) {
        activeMaps[id].remove();
      }
      delete activeMaps[id];
    });

    complaints.forEach(item => {
      const coords = parseCoords(item.coords);
      const container = document.getElementById("map-" + item.id);
      
      if(container && coords){
        try {
          const map = L.map(container, {
            attributionControl: false,
            zoomControl: false
          }).setView([coords.lat, coords.lng], 15);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
          }).addTo(map);

          L.marker([coords.lat, coords.lng]).addTo(map)
            .bindPopup(`<b>${item.customer}</b><br>[${item.category}]`);

          activeMaps[item.id] = map;
        } catch(e) {
          console.warn("Map render skipped for", item.id);
        }
      }
    });
  }

  function render(){
    const root = document.getElementById("app-root");
    if(!root) return;
    root.innerHTML = "";

    const { dateMap, itemScheduledDateMap } = calculateCalendarSchedule();

    let base = complaints;

    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      base = base.filter(c => 
        (c.customer && c.customer.toLowerCase().includes(q)) ||
        (c.id && c.id.toLowerCase().includes(q)) ||
        (c.meterId && c.meterId.toLowerCase().includes(q)) ||
        (c.address && c.address.toLowerCase().includes(q))
      );
    }

    if (quickFilter === "urgent") {
      base = base.filter(c => urgencyLevel(c) === "tinggi");
    } else if (quickFilter === "reschedule") {
      base = base.filter(c => c.rescheduledDate);
    }

    // Pemfilteran Presisi Berdasarkan CASE
    if (categoryFilter !== "semua") {
      base = base.filter(c => c.category === categoryFilter);
    }

    if (selectedDate) {
      const selKey = formatDateKey(selectedDate);
      base = base.filter(item => {
        const schedDate = itemScheduledDateMap[item.id];
        return schedDate && formatDateKey(schedDate) === selKey;
      });
    }

    // Fungsi Pengurutan Tingkat Tinggi & Akses Cepat
    const sortedByMode = (items) => {
      if (sortMode === "prioritas") {
        return [...items].sort((a,b) => {
          const scoreA = priorityScore(a);
          const scoreB = priorityScore(b);
          if (scoreB !== scoreA) return scoreB - scoreA;
          
          const areaA = (a.area || "").toLowerCase();
          const areaB = (b.area || "").toLowerCase();
          if (areaA !== areaB) return areaA.localeCompare(areaB);

          return new Date(a.receivedAt) - new Date(b.receivedAt);
        });
      } else if (sortMode === "waktu-terbaru") {
        return [...items].sort((a,b) => new Date(b.receivedAt) - new Date(a.receivedAt));
      } else if (sortMode === "waktu-lama") {
        return [...items].sort((a,b) => new Date(a.receivedAt) - new Date(b.receivedAt));
      } else if (sortMode === "nama") {
        return [...items].sort((a,b) => (a.customer || "").localeCompare(b.customer || ""));
      }
      return items;
    };

    const belum = sortedByMode(base.filter(c => c.status === "baru"));
    const proses = sortedByMode(base.filter(c => c.status === "proses"));

          ),

                  el("option", { value:"prioritas", selected: sortMode==="prioritas" ? "selected" : null }, "⚡ Skor Urgensi (Tinggi-Rendah)"),
                  el("option", { value:"waktu-terbaru", selected: sortMode==="waktu-terbaru" ? "selected" : null }, "🕒 Waktu Lapor (Terbaru)"),
                  el("option", { value:"waktu-lama", selected: sortMode==="waktu-lama" ? "selected" : null }, "⏳ Waktu Lapor (Terlama)"),
                  el("option", { value:"nama", selected: sortMode==="nama" ? "selected" : null }, "🔤 Nama Pelanggan (A-Z)")
                )
              )
            )
          ),

          renderForm(),
          renderEmailParserModal(),
          renderHistoryModal(),

          selectedDate ? el("div", { class: "filter-date-banner" },
            el("span", {}, `📅 Menampilkan Kasus Tanggal: ${fmtDateOnly(selectedDate)}`),
            el("button", { class: "btn-text", style: "color:var(--accent); font-size:12px;", onclick: () => { selectedDate = null; render(); } }, "Tampilkan Semua")
          ) : null,

          section("Belum Dikerjakan", belum, true),
          section("Sedang Dikerjakan", proses, false),
          section("Selesai", selesai, false)
        ),

        el("div", {},
          renderSidebarCalendar(dateMap)
        )
      ),

      el("div", { style: "text-align:center; margin-top:32px;" },
        el("button", { class:"btn-text", onclick: async () => {
          if(confirm("Hapus semua data komplain dari server?")){
            for(const c of complaints){
              await sb.from(TABLE).delete().eq("id", c.id);
            }
            await load();
          }
        }}, "Kosongkan semua data")
      )
    );

    root.appendChild(wrap);

    if(!storageOk){
      const warn = el("div", { style:"margin-top:12px; font-size:12px; color:var(--tinggi); text-align:center;" }, "Terhubung dalam mode cadangan lokal.");
      root.appendChild(warn);
    }

    setTimeout(initMaps, 100);
  }

  load();
  sb.channel("complaints-sync")
    .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, () => load())
    .subscribe();
  setInterval(render, 60000);
})();
</script>
